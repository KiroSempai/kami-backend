<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KAMI — Foro Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/css/glass-hub.css">
  <style>
    :root {
      --bg-base: #07070e;
      --bg-surface: #0f0f1a;
      --bg-card: #14141f;
      --bg-card-hover: #1c1c2e;
      --accent: #e8334a;
      --accent-dim: rgba(232,51,74,0.18);
      --accent-glow: rgba(232,51,74,0.08);
      --gold: #f5c842;
      --gold-dim: rgba(245,200,66,0.12);
      --green: #2dca7a;
      --green-dim: rgba(45,202,122,0.14);
      --blue: #4c9df5;
      --blue-dim: rgba(76,157,245,0.14);
      --text-primary: #f2f2fa;
      --text-secondary: #8888a0;
      --text-muted: #4a4a62;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --radius-pill: 999px;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-jp: 'Noto Sans JP', sans-serif;
      --ease: cubic-bezier(0.4,0,0.2,1);
      --nav-top-h: 60px;
      --nav-bot-h: 72px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      padding-top: var(--nav-top-h);
      padding-bottom: var(--nav-bot-h);
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; }
    ::-webkit-scrollbar { display: none; }

    /* ── TOP NAV ── */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      height: var(--nav-top-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(7, 7, 14, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }

    .top-nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8334a, #ff7c6e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 2px rgba(232, 51, 74, 0.3);
      flex-shrink: 0;
      transition: all 0.18s var(--ease);
    }

    .top-avatar:hover {
      box-shadow: 0 0 0 3px rgba(232, 51, 74, 0.5);
    }

    .top-nav-logo {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 3px;
      color: var(--text-primary);
    }

    .top-nav-logo span {
      color: var(--accent);
    }

    .top-nav-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.18s var(--ease);
    }

    .top-icon-btn:active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    /* ── SUBTABS ── */
    .subtabs {
      position: fixed;
      top: var(--nav-top-h);
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(7, 7, 14, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0;
      padding: 0 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .subtabs::-webkit-scrollbar {
      display: none;
    }

    .subtab {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s var(--ease);
    }

    .subtab:hover {
      color: var(--text-secondary);
      border-bottom-color: var(--border-hover);
    }

    .subtab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── MAIN CONTENT ── */
    .main {
      padding-top: 52px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* ── POST ── */
    .post {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      cursor: pointer;
      transition: background 0.18s var(--ease);
    }

    .post:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .post-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8334a, #ff7c6e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px var(--bg-surface);
    }

    .post-content {
      flex: 1;
      min-width: 0;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .post-author {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 14px;
    }

    .post-handle {
      color: var(--text-muted);
      font-size: 13px;
    }

    .post-time {
      color: var(--text-muted);
      font-size: 13px;
      margin-left: auto;
    }

    .post-text {
      color: var(--text-primary);
      line-height: 1.5;
      margin-bottom: 12px;
      font-size: 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .post-image {
      width: 100%;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 12px;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, var(--bg-card), var(--bg-card-hover));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .post-actions {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }

    .post-action {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.18s var(--ease);
      flex: 1;
      justify-content: center;
    }

    .post-action:hover {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .post-action i {
      font-size: 14px;
    }
    .post-action.liked { color: var(--accent); }
    .post-action.reposted { color: var(--green); }
    .post-action.bookmarked { color: var(--blue); }
    .notification.unread { background: rgba(232,51,74,0.06); border-left: 3px solid var(--accent); padding-left: 13px; }
    .bnav-badge { position: absolute; top: 2px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 9px; font-weight: 700; display: none; align-items: center; justify-content: center; pointer-events: none; }
    .bnav-item { position: relative; }

    /* ── COMPOSE ── */
    .compose {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .compose-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8334a, #ff7c6e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px var(--bg-surface);
    }

    .compose-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .compose-input {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      font-family: var(--font-body);
      outline: none;
      resize: none;
    }

    .compose-input::placeholder {
      color: var(--text-muted);
    }

    .compose-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .compose-icons {
      display: flex;
      gap: 8px;
    }

    .compose-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--accent);
      font-size: 16px;
      transition: all 0.18s var(--ease);
    }

    .compose-icon:hover {
      background: var(--accent-glow);
    }

    .compose-btn {
      padding: 8px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s var(--ease);
    }

    .compose-btn:hover {
      opacity: 0.9;
    }

    .compose-btn:active {
      opacity: 0.8;
    }

    /* ── NOTIFICATION ── */
    .notification {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      cursor: pointer;
      transition: background 0.18s var(--ease);
    }

    .notification:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .notification-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 18px;
      flex-shrink: 0;
    }

    .notification-content {
      flex: 1;
    }

    .notification-text {
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .notification-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── MESSAGE ── */
    .message {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      cursor: pointer;
      transition: background 0.18s var(--ease);
    }

    .message:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .message-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8334a, #ff7c6e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px var(--bg-surface);
    }

    .message-content {
      flex: 1;
      min-width: 0;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .message-name {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 14px;
    }

    .message-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .message-preview {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── CHAT VIEW ── */
    .chat-view {
      height: calc(100vh - 132px);
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      width: fit-content;
    }

    .message-bubble.sent {
      background: var(--accent);
      color: white;
      align-self: flex-end;
    }

    .message-bubble.received {
      background: var(--bg-card);
      color: var(--text-primary);
      align-self: flex-start;
    }

    .chat-input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 14px;
      outline: none;
      resize: none;
      max-height: 100px;
    }

    .chat-input::placeholder {
      color: var(--text-muted);
    }

    .chat-send {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.18s var(--ease);
    }

    .chat-send:hover {
      opacity: 0.9;
    }

    /* ── TRENDING ── */
    .trending {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.18s var(--ease);
    }

    .trending:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .trending-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .trending-title {
      font-weight: 700;
      color: var(--text-primary);
      font-size: 16px;
      margin-bottom: 4px;
    }

    .trending-stats {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      padding: 40px 16px;
      text-align: center;
      color: var(--text-muted);
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      height: var(--nav-bot-h);
      background: rgba(7, 7, 14, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .bnav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex: 1;
      height: 100%;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.18s var(--ease);
      font-size: 18px;
      position: relative;
    }

    .bnav-item.active {
      color: var(--accent);
    }

    .bnav-item:hover {
      color: var(--text-secondary);
    }

    .bnav-label {
      font-size: 10px;
      font-weight: 600;
    }

    .bnav-badge {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- TOP NAV -->
  <div class="top-nav">
    <div class="top-nav-left">
      <div class="top-avatar" id="top-avatar-btn" onclick="window.openGlassDrawer()">?</div>
      <div class="top-nav-logo">KA<span>MI</span></div>
    </div>
    <div class="top-nav-right">
      <button class="top-icon-btn">
        <i class="ti ti-search"></i>
      </button>
      <button class="top-icon-btn">
        <i class="ti ti-dots-vertical"></i>
      </button>
    </div>
  </div>

  <!-- SUBTABS -->
  <div class="subtabs" id="subtabs"></div>

  <!-- MAIN CONTENT -->
  <div class="main">
    <!-- INICIO PAGE -->
    <div class="page active" id="page-inicio">
      <div class="compose">
        <div class="compose-avatar">RD</div>
        <div class="compose-content">
          <textarea class="compose-input" placeholder="¿Qué está pasando?" id="composeText" rows="3"></textarea>
          <div class="compose-actions">
            <div class="compose-icons">
              <div class="compose-icon"><i class="ti ti-photo"></i></div>
              <div class="compose-icon"><i class="ti ti-movie"></i></div>
              <div class="compose-icon"><i class="ti ti-chart-bar"></i></div>
              <div class="compose-icon"><i class="ti ti-mood-smile"></i></div>
            </div>
            <button class="compose-btn" onclick="postTweet()">Postear</button>
          </div>
        </div>
      </div>
      <div id="posts-feed"></div>
    </div>

    <!-- EXPLORAR PAGE -->
    <div class="page" id="page-explorar">
      <div id="explore-content"></div>
    </div>

    <!-- MARCADORES PAGE -->
    <div class="page" id="page-marcadores">
      <div id="bookmarks-content"></div>
    </div>

    <!-- NOTIFICACIONES PAGE -->
    <div class="page" id="page-notificaciones">
      <div id="notifications-feed"></div>
    </div>

    <!-- MENSAJES PAGE -->
    <div class="page" id="page-mensajes">
      <div id="messages-list"></div>
      <div id="chat-container" style="display: none;"></div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="bnav-item active" onclick="switchRoute(this, 'inicio')">
      <i class="ti ti-home"></i>
      <div class="bnav-label">Inicio</div>
    </div>
    <div class="bnav-item" onclick="switchRoute(this, 'explorar')">
      <i class="ti ti-compass"></i>
      <div class="bnav-label">Explorar</div>
    </div>
    <div class="bnav-item" onclick="switchRoute(this, 'marcadores')">
      <i class="ti ti-bookmark"></i>
      <div class="bnav-label">Guardados</div>
    </div>
    <div class="bnav-item" onclick="switchRoute(this, 'notificaciones')">
      <i class="ti ti-bell"></i>
      <div class="bnav-label">Notificaciones</div>
      <div class="bnav-badge">3</div>
    </div>
    <div class="bnav-item" onclick="switchRoute(this, 'mensajes')">
      <i class="ti ti-message-circle"></i>
      <div class="bnav-label">Mensajes</div>
    </div>
  </div>

  <script>
    var postsData = [];
    var _currentUserId = null;
    try { var _u = JSON.parse(localStorage.getItem('kami_user') || 'null'); if (_u) _currentUserId = _u.id; } catch(e) {}

    // ── Load user avatar into top bar ──
    (function() {
      var u = null; try { u = JSON.parse(localStorage.getItem('kami_user') || 'null'); } catch(e) {}
      var av = document.getElementById('top-avatar-btn');
      if (av && u) {
        if (u.avatar && (u.avatar.indexOf('/') === 0 || u.avatar.indexOf('http') === 0)) {
          av.innerHTML = '<img src="' + u.avatar + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
        } else {
          av.textContent = (u.username || '?').charAt(0).toUpperCase();
        }
      }
    })();

    const notificationsData = [
      { type: "like", icon: "ti-heart-filled", text: "UserPrueba te dio me gusta", time: "2h" },
      { type: "follow", icon: "ti-user-plus", text: "Anime Official te comenzó a seguir", time: "4h" },
      { type: "repost", icon: "ti-repeat", text: "MangaFan reposteó tu post", time: "6h" }
    ];

    const messagesData = [
      { name: "KiroS", handle: "@kiro", avatar: "KS", preview: "Viste el último capítulo de JJK?", time: "2m", messages: [
        { sent: false, text: "Viste el último capítulo de JJK?" },
        { sent: true, text: "Sí, estuvo brutal 🔥" },
        { sent: false, text: "Verdad! Ese twist fue épico" }
      ]},
      { name: "UserPrueba", handle: "@userprueba", avatar: "UP", preview: "Tienes razón, fue épico 🔥", time: "1h", messages: [] },
      { name: "AnimeNews", handle: "@animenews", avatar: "AN", preview: "Nuevo manga anunciado", time: "3h", messages: [] }
    ];

    let currentRoute = "inicio";
    let currentSubtab = "para-ti";

    function renderSubtabs() {
      const subtabs = document.getElementById('subtabs');
      const routes = {
        'inicio': ['Para ti', 'Mis comunidades'],
        'explorar': ['Para ti', 'Comunidades'],
        'mensajes': ['Directos', 'Comunidades']
      };

      const tabs = routes[currentRoute] || [];
      subtabs.innerHTML = tabs.map((tab, idx) => `
        <div class="subtab ${idx === 0 ? 'active' : ''}" onclick="switchSubtab(this, '${tab.toLowerCase()}')">${tab}</div>
      `).join('');
    }

    function timeAgo(d) {
      var diff = Date.now() - new Date(d).getTime(), m = Math.floor(diff / 60000);
      if (m < 1) return 'Ahora'; if (m < 60) return m + 'm';
      var h = Math.floor(m / 60); if (h < 24) return h + 'h';
      return Math.floor(h / 24) + 'd';
    }

    function showToast(type, msg) {
      var c = document.getElementById('toast-c');
      if (!c) { c = document.createElement('div'); c.id = 'toast-c'; c.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:center'; document.body.appendChild(c); }
      var t = document.createElement('div');
      t.style.cssText = 'padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;color:#fff;background:' + (type === 'error' ? '#e8344a' : '#2dca7a') + ';box-shadow:0 4px 12px rgba(0,0,0,.3);animation:fadeUp .3s';
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(function(){ t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function(){ t.remove(); }, 300); }, 3000);
    }

    async function loadFeed() {
      const feed = document.getElementById('posts-feed');
      feed.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">Cargando...</div>';
      var token = localStorage.getItem('kami_token');
      var opts = { headers: {} };
      if (token) opts.headers['Authorization'] = 'Bearer ' + token;
      try {
        var r = await fetch('/api/feed/posts?limit=25', opts);
        if (!r.ok) throw new Error('Error');
        var d = await r.json();
        if (!d.success || !d.posts || !d.posts.length) {
          feed.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Sin publicaciones</div>';
          return;
        }
        postsData = d.posts;
        renderPosts(d.posts);
      } catch(e) {
        feed.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Error de conexi&oacute;n</div>';
      }
    }

    function renderPosts(posts) {
      const feed = document.getElementById('posts-feed');
      feed.innerHTML = (posts || []).map(function(p) {
        var initial = (p.user || '?').charAt(0).toUpperCase();
        var avatarHtml = p.avatar && (p.avatar.indexOf('/') === 0 || p.avatar.indexOf('http') === 0)
          ? '<img src="' + p.avatar + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">'
          : initial;
        var likeClass = p.user_has_liked ? ' liked' : '';
        var repostClass = p.user_has_reposted ? ' reposted' : '';
        var bmClass = p.user_has_bookmarked ? ' bookmarked' : '';
        return '<div class="post">' +
          '<div class="post-avatar">' + avatarHtml + '</div>' +
          '<div class="post-content">' +
          '<div class="post-header">' +
          '<a href="/profile/' + encodeURIComponent(p.user) + '" style="color:inherit;text-decoration:none;"><div class="post-author">' + (p.user || 'Anónimo') + '</div></a>' +
          '<div class="post-handle">' + (p.handle || '@' + (p.user || '').toLowerCase()) + '</div>' +
          '<div class="post-time">' + timeAgo(p.created_at) + '</div>' +
          '</div>' +
          '<div class="post-text">' + (p.text || '').replace(/\n/g, '<br>') + '</div>' +
          (p.media_url ? '<div style="margin-top:8px;border-radius:14px;overflow:hidden;max-height:300px;"><img src="' + p.media_url + '" style="width:100%;display:block;object-fit:cover;"></div>' : '') +
          '<div class="post-actions">' +
          '<div class="post-action"><i class="ti ti-message-circle"></i> ' + (p.replies || 0) + '</div>' +
          '<div class="post-action' + repostClass + '" onclick="toggleRepost(' + p.id + ')"><i class="ti ti-repeat"></i> <span class="repost-cnt">' + (p.reposts || 0) + '</span></div>' +
          '<div class="post-action' + likeClass + '" onclick="toggleLike(' + p.id + ')"><i class="ti ti-heart"></i> <span class="like-cnt">' + (p.likes || 0) + '</span></div>' +
          '<div class="post-action' + bmClass + '" onclick="toggleBookmark(' + p.id + ')"><i class="ti ti-bookmark"></i></div>' +
          '</div></div></div>';
      }).join('');
    }

    async function interact(postId, type) {
      var token = localStorage.getItem('kami_token');
      if (!token) { showToast('error', 'Debes iniciar sesi\u00f3n'); return; }
      try {
        var r = await fetch('/api/feed/interact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ post_id: postId, interaction_type: type })
        });
        if (r.ok) loadFeed();
      } catch(e) {}
    }
    function toggleLike(id) { interact(id, 'like'); }
    function toggleRepost(id) { interact(id, 'repost'); }
    function toggleBookmark(id) { interact(id, 'bookmark'); }

    async function loadNotifications() {
      var token = localStorage.getItem('kami_token');
      if (!token) { document.getElementById('notifications-feed').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Inicia sesi\u00f3n para ver notificaciones</div>'; return; }
      var feed = document.getElementById('notifications-feed');
      feed.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">Cargando...</div>';
      try {
        var r = await fetch('/api/feed/notifications?limit=30', { headers: { 'Authorization': 'Bearer ' + token } });
        var d = await r.json();
        if (!d.success || !d.notifications || !d.notifications.length) {
          feed.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Sin notificaciones a\u00fan</div>';
          return;
        }
        var icons = { like:'❤️',repost:'🔁',bookmark:'🔖',reply:'💬',follow:'👤' };
        feed.innerHTML = d.notifications.map(function(n){
          return '<div class="notification' + (n.read ? '' : ' unread') + '">' +
            '<div class="notification-icon">' + (icons[n.type] || '🔔') + '</div>' +
            '<div class="notification-content">' +
            '<div class="notification-text"><strong>' + (n.actor?.username || 'Alguien') + '</strong> ' +
            (n.type === 'like' ? 'le dio like a tu post' :
             n.type === 'repost' ? 'comparti\u00f3 tu post' :
             n.type === 'bookmark' ? 'guard\u00f3 tu post' :
             n.type === 'reply' ? 'respondi\u00f3 a tu post' :
             n.type === 'follow' ? 'te comenz\u00f3 a seguir' : 'interactu\u00f3') +
            '</div><div class="notification-time">' + timeAgo(n.created_at) + '</div></div></div>';
        }).join('');
        updateNotifBadge(d.unread_count);
      } catch(e) { feed.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Error al cargar</div>'; }
    }

    function updateNotifBadge(count) {
      var badge = document.querySelector('.bnav-badge');
      if (badge) {
        if (count > 0) { badge.textContent = count > 9 ? '9+' : count; badge.style.display = 'flex'; }
        else { badge.style.display = 'none'; }
      }
    }

    async function loadBookmarks() {
      var token = localStorage.getItem('kami_token');
      if (!token) { document.getElementById('bookmarks-content').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Inicia sesi\u00f3n</div>'; return; }
      var el = document.getElementById('bookmarks-content');
      el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">Cargando...</div>';
      try {
        var r = await fetch('/api/feed/bookmarks', { headers: { 'Authorization': 'Bearer ' + token } });
        var d = await r.json();
        if (!d.success || !d.posts || !d.posts.length) {
          el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Sin marcadores guardados</div>';
          return;
        }
        postsData = d.posts;
        renderPosts(d.posts);
      } catch(e) { el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Error al cargar</div>'; }
    }

    function renderNotifications() { loadNotifications(); }
    function renderBookmarks() { loadBookmarks(); }
    function renderMessages() {
      const list = document.getElementById('messages-list');
      list.innerHTML = messagesData.map((msg, idx) => `
        <div class="message" onclick="openChat(${idx})">
          <div class="message-avatar">${msg.avatar}</div>
          <div class="message-content">
            <div class="message-header">
              <div class="message-name">${msg.name}</div>
              <div class="message-time">${msg.time}</div>
            </div>
            <div class="message-preview">${msg.preview}</div>
          </div>
        </div>
      `).join('');
    }

    function renderExplore() {
      const explore = document.getElementById('explore-content');
      explore.innerHTML = `
        <div class="trending">
          <div class="trending-label">Tendencia Worldwide</div>
          <div class="trending-title">Jujutsu Kaisen</div>
          <div class="trending-stats">2.5M Publicaciones</div>
        </div>
        <div class="trending">
          <div class="trending-label">Tendencia Worldwide</div>
          <div class="trending-title">One Piece</div>
          <div class="trending-stats">1.8M Publicaciones</div>
        </div>
        <div class="trending">
          <div class="trending-label">Tendencia Worldwide</div>
          <div class="trending-title">My Hero Academia</div>
          <div class="trending-stats">1.3M Publicaciones</div>
        </div>
      `;
    }

    function renderBookmarks() {
      const bookmarks = document.getElementById('bookmarks-content');
      bookmarks.innerHTML = `
        <div class="trending">
          <div class="trending-label">Tu colección #1</div>
          <div class="trending-title">Mi Lista de Lectura</div>
          <div class="trending-stats">12 posts guardados</div>
        </div>
        <div class="trending">
          <div class="trending-label">Tu colección #2</div>
          <div class="trending-title">Análisis de Anime</div>
          <div class="trending-stats">8 posts guardados</div>
        </div>
      `;
    }

    function switchRoute(nav, route) {
      currentRoute = route;
      currentSubtab = 'para-ti';
      
      document.querySelectorAll('.bnav-item').forEach(item => item.classList.remove('active'));
      nav.classList.add('active');
      
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById(`page-${route}`).classList.add('active');
      
      renderSubtabs();

      if (route === 'inicio') loadFeed();
      else if (route === 'explorar') renderExplore();
      else if (route === 'marcadores') renderBookmarks();
      else if (route === 'notificaciones') renderNotifications();
      else if (route === 'mensajes') renderMessages();
      
      document.getElementById('messages-list').style.display = route === 'mensajes' ? 'block' : 'none';
      document.getElementById('chat-container').style.display = 'none';
    }

    function switchSubtab(tab, subtab) {
      document.querySelectorAll('.subtab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentSubtab = subtab;
    }

    async function toggleLike(id) {
      var token = localStorage.getItem('kami_token');
      if (!token) return;
      try {
        var r = await fetch('/api/feed/interact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ post_id: id, interaction_type: 'like' })
        });
        if (r.ok) loadFeed();
      } catch(e) {}
    }

    async function postTweet() {
      const text = document.getElementById('composeText').value;
      if (!text.trim()) return;
      var token = localStorage.getItem('kami_token');
      if (!token) { alert('Debes iniciar sesión'); return; }
      try {
        var r = await fetch('/api/feed/post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ content: text.trim(), post_type: 'post' })
        });
        var d = await r.json();
        if (d.success) {
          document.getElementById('composeText').value = '';
          loadFeed();
        }
      } catch(e) {}
    }

    function openChat(idx) {
      const msg = messagesData[idx];
      const chatContainer = document.getElementById('chat-container');
      const messagesList = document.getElementById('messages-list');
      
      messagesList.style.display = 'none';
      chatContainer.style.display = 'block';
      
      chatContainer.innerHTML = `
        <div class="chat-view">
          <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 12px;">
              <button style="background: rgba(255,255,255,0.05); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer;" onclick="closeChat()">
                <i class="ti ti-arrow-left"></i>
              </button>
              <div>
                <div style="font-weight: 600; color: var(--text-primary);">${msg.name}</div>
                <div style="font-size: 12px; color: var(--text-muted);">${msg.handle}</div>
              </div>
            </div>
            <button style="background: rgba(255,255,255,0.05); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer;">
              <i class="ti ti-dots-vertical"></i>
            </button>
          </div>
          <div class="chat-messages">
            ${msg.messages.map(m => `
              <div class="message-bubble ${m.sent ? 'sent' : 'received'}">${m.text}</div>
            `).join('')}
          </div>
          <div class="chat-input-area">
            <input type="text" class="chat-input" placeholder="Escribe un mensaje...">
            <button class="chat-send"><i class="ti ti-send"></i></button>
          </div>
        </div>
      `;
    }

    function closeChat() {
      document.getElementById('messages-list').style.display = 'block';
      document.getElementById('chat-container').style.display = 'none';
    }

    // Inicializar
    loadFeed();
    renderSubtabs();
  </script>
  <script src="/js/glass-hub.js"></script>
</body>
</html>
