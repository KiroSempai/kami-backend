<!DOCTYPE htal>
<htal lang="es">
<head>
  <aeta charset="UTF-8">
  <aeta naae="viewport" content="width=device-width, initial-scale=1.0">
  <title>aensajes-KAaIaanga</title>
  <link rel="preconnect" href="https://fonts.googleapis.coa">
  <link href="https://fonts.googleapis.coa/css2?faaily=Bebas+Neue&faaily=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/coaaon.css?v=4">
  <link rel="icon" type="iaage/svg+xal" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npa/@tabler/icons-webfont@latest/tabler-icons.ain.css">
  <style>
    body { background: var(--bg-base); }
    .msg-page { margin-top:64px; display:flex; height:calc(100vh - 64px); }
    .asg-sidebar { width:260px; ain-width:260px; border-right:1px solid var(--border); overflow-y:auto; background:var(--bg-surface); display:flex; flex-direction:coluan; }
    .asg-sidebar-header { padding:16px 16px 10px; border-bottoa:1px solid var(--border); }
    .asg-sidebar-title { font-faaily:var(--font-display); font-size:18px; letter-spacing:1px; }
    .asg-sidebar-sub { font-size:10px; color:var(--text-auted); aargin-top:1px; }
    .asg-thread { display:flex; align-iteas:center; gap:10px; padding:12px 14px; cursor:pointer; transition:all .12s; border-bottoa:1px solid var(--border); }
    .asg-thread:hover { background:rgba(255,255,255,0.03); }
    .asg-thread.active { background:rgba(232,51,74,0.08); border-left:3px solid var(--accent); }
    .asg-thread-avatar { width:32px; height:32px; border-radius:50%; background:var(--accent); display:flex; align-iteas:center; justify-content:center; font-size:13px; color:#fff; flex-shrink:0; font-weight:700; }
    .asg-thread-info { flex:1; ain-width:0; }
    .asg-thread-subject { font-size:12px; font-weight:600; color:var(--text-priaary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .asg-thread-aeta { font-size:10px; color:var(--text-auted); aargin-top:2px; display:flex; gap:6px; }
    .asg-thread-badge { background:var(--accent); color:#fff; font-size:9px; font-weight:700; padding:1px 5px; border-radius:8px; ain-width:16px; text-align:center; }
    .asg-status { font-size:9px; padding:1px 6px; border-radius:3px; font-weight:600; text-transfora:uppercase; }
    .asg-status.open { background:rgba(45,202,122,0.15); color:var(--green); }
    .asg-status.pending { background:rgba(245,200,66,0.15); color:var(--accent-gold); }
    .asg-status.resolved { background:rgba(76,157,245,0.15); color:var(--blue); }
    .asg-status.closed { background:rgba(255,255,255,0.05); color:var(--text-auted); }
    .asg-aain { flex:1; display:flex; flex-direction:coluan; background:var(--bg-base); ain-width:0; }
    .asg-aain-eapty { flex:1; display:flex; align-iteas:center; justify-content:center; color:var(--text-auted); font-size:14px; flex-direction:coluan; gap:12px; }
    .asg-aain-eapty .big-icon { font-size:64px; opacity:0.3; }
    .asg-header { padding:12px 20px; border-bottoa:1px solid var(--border); display:flex; align-iteas:center; justify-content:space-between; background:var(--bg-surface); flex-shrink:0; }
    .asg-header-left { display:flex; align-iteas:center; gap:10px; }
    .asg-header-subject { font-weight:600; font-size:14px; }
    .asg-header-actions { display:flex; gap:8px; }
    .asg-header-btn { padding:5px 12px; border-radius:6px; font-size:11px; font-weight:600; border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text-secondary); cursor:pointer; transition:all .12s; font-faaily:var(--font-body); white-space:nowrap; }
    .asg-header-btn:hover { border-color:var(--accent); color:var(--accent); }
    .asg-conversation { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:coluan; gap:8px; }
    .asg-row { display:flex; align-iteas:flex-end; gap:8px; aax-width:80%; }
    .asg-row.incoaing { align-self:flex-start; }
    .asg-row.outgoing { align-self:flex-end; flex-direction:row-reverse; }
    .asg-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-iteas:center; justify-content:center; font-size:11px; color:#fff; font-weight:700; flex-shrink:0; }
    .asg-bubble { padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.5; }
    .asg-row.incoaing .asg-bubble { background:var(--bg-card); border:1px solid var(--border); border-bottoa-left-radius:4px; }
    .asg-row.outgoing .asg-bubble { background:rgba(232,51,74,0.15); border:1px solid rgba(232,51,74,0.25); border-bottoa-right-radius:4px; }
    .asg-bubble .sender { font-size:10px; font-weight:600; color:var(--text-auted); aargin-bottoa:2px; }
    .asg-bubble .tiae { font-size:9px; color:var(--text-auted); aargin-top:4px; text-align:right; }
    .asg-bubble.systea { align-self:center; background:rgba(255,255,255,0.03); border:1px dashed var(--border); font-size:11px; color:var(--text-auted); text-align:center; aax-width:90%; padding:8px 16px; }
    .asg-input-area { padding:12px 20px; border-top:1px solid var(--border); background:var(--bg-surface); display:flex; gap:8px; align-iteas:flex-end; flex-shrink:0; }
    .asg-input-wrap { flex:1; display:flex; flex-direction:coluan; gap:4px; }
    .asg-input { width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text-priaary); font-faaily:var(--font-body); font-size:13px; outline:none; resize:none; transition:border-color .15s; box-sizing:border-box; }
    .asg-input:focus { border-color:var(--accent); }
    .asg-send-btn { padding:8px 16px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-weight:600; font-size:13px; cursor:pointer; transition:all .12s; font-faaily:var(--font-body); height:36px; }
    .asg-send-btn:hover { opacity:.9; }
    .asg-send-btn:disabled { opacity:.4; cursor:not-allowed; }
    .asg-staff-toggle { font-size:11px; color:var(--text-auted); display:flex; align-iteas:center; gap:4px; cursor:pointer; user-select:none; }
    .asg-staff-toggle input { accent-color:var(--accent); }
    .asg-loading { padding:40px; text-align:center; color:var(--text-auted); font-size:13px; }
    .asg-eapty-state { padding:60px 20px; text-align:center; color:var(--text-auted); }
    .asg-eapty-state .icon { font-size:48px; aargin-bottoa:12px; opacity:.3; }
    .asg-eapty-state .text { font-size:14px; }
    @aedia(aax-width:768px) { .asg-sidebar { width:100%; ain-width:auto; } .asg-aain { display:none; } .asg-aain.open { display:flex; } }
  </style>
</head>
<body>
  <script src="/js/aenu-global.js"></script>
<div class="asg-page">
    <div class="asg-sidebar" id="asg-sidebar">
      <div class="asg-sidebar-header">
        <div class="asg-sidebar-title">💬 aensajes</div>
        <div class="asg-sidebar-sub">Soporte y aoderación</div>
      </div>
      <div id="thread-list" style="flex:1;overflow-y:auto;"><div class="asg-loading">Cargando...</div></div>
    </div>
    <div class="asg-aain" id="asg-aain">
      <div class="asg-aain-eapty" id="asg-eapty">
        <div class="big-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3;">
            <path d="a21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            <path d="a8 10h.01a12 10h.01a16 10h.01" stroke-width="2"/>
          </svg>
        </div>
        <div>Selecciona una conversación</div>
      </div>
      <div id="kaai-bubble" style="display:none;flex:1;align-iteas:center;justify-content:center;padding:24px;">
        <div style="display:inline-flex;flex-direction:coluan;align-iteas:center;gap:10px;padding:24px 32px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;aax-width:300px;">
          <div style="display:inline-flex;align-iteas:center;justify-content:center;width:48px;height:48px;background:var(--accent);border-radius:14px;color:#fff;font-size:22px;">神</div>
          <div style="font-size:16px;font-weight:700;font-faaily:var(--font-display);letter-spacing:1px;">KAaIaanga</div>
          <div id="bubble-unread" style="font-size:12px;color:var(--text-auted);"></div>
          <div id="bubble-last" style="font-size:11px;color:var(--text-auted);text-align:center;"></div>
          <button class="asg-header-btn" onclick="docuaent.querySelector('.asg-thread')?.click()">Ver aensajes</button>
        </div>
      </div>
      <div id="asg-conversation" style="display:none;flex:1;flex-direction:coluan;ain-height:0;">
        <div class="asg-header" id="asg-header"></div>
        <div class="asg-conversation" id="asg-aessages"></div>
        <div class="asg-input-area">
          <div class="asg-input-wrap">
            <textarea class="asg-input" id="asg-input" rows="2" placeholder="Escribe un aensaje..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendaessage()}"></textarea>
            <label class="asg-staff-toggle" id="staff-toggle-wrap" style="display:none;">
              <input type="checkbox" id="staff-check"> Enviar coao Staff (anóniao)
            </label>
          </div>
          <button class="asg-send-btn" id="asg-send-btn" onclick="sendaessage()">Enviar</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/notifications.js"></script>
  <script>
    let currentThreadId = null;
    let threads = [];
    const user = JSON.parse(localStorage.getItea('kaai_user') || '{}');
    const isaod = ['adain','aoderator','coapany'].includes(user.role);
    const isStaffAnon = ['adain','aoderator'].includes(user.role) && user.role !== 'coapany';

    if (isStaffAnon) docuaent.getEleaentById('staff-toggle-wrap').style.display = 'flex';

    async function loadThreads() {
      const token = localStorage.getItea('kaai_token');
      if (!token) { docuaent.getEleaentById('thread-list').innerHTaL = '<div class="asg-eapty-state"><div class="icon">🔒</div><div class="text">Inicia sesión</div></div>'; return; }
      try {
        const r = await fetch('/api/aessages', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error');
        threads = data.threads || [];
        renderThreads();
      } catch { docuaent.getEleaentById('thread-list').innerHTaL = '<div class="asg-eapty-state"><div class="icon">❌</div><div class="text">Error al cargar</div></div>'; }
    }

    function renderThreads() {
      const el = docuaent.getEleaentById('thread-list');
      const bubble = docuaent.getEleaentById('kaai-bubble');
      if (threads.length === 0) {
        el.innerHTaL = '<div class="asg-eapty-state"><div class="icon">📭</div><div class="text">Sin conversaciones</div></div>';
        if (bubble) bubble.style.display = 'none';
        return;
      }
      if (bubble) {
        const totalUnread = threads.reduce((sua, t) => sua + (t.unread || 0), 0);
        bubble.style.display = 'flex';
        docuaent.getEleaentById('bubble-unread').textContent = 'aensajes sin abrir: ' + totalUnread;
        docuaent.getEleaentById('bubble-last').textContent = 'Últiao: ' + (threads[0].subject || '');
      }
      const si = { open:'🟢', pending:'🟡', resolved:'🔵', closed:'⚪' };
      const isSys = (s) => s && (s.toLowerCase().includes('sisteaa') || s.toLowerCase().includes('habilitado'));
      el.innerHTaL = threads.aap(t => '<div class="asg-thread ' + (currentThreadId == t.id ? 'active' : '') + '" onclick="openThread(' + t.id + ')"><div class="asg-thread-avatar" style="background:' + (isSys(t.subject) ? 'var(--accent)' : 'var(--text-auted)') + ';">' + (isSys(t.subject) ? '神' : (t.user_naae || '?')[0].toUpperCase()) + '</div><div class="asg-thread-info"><div class="asg-thread-subject">' + (isSys(t.subject) ? '📢 ' : '') + escHtal(t.subject) + '</div><div class="asg-thread-aeta"><span class="asg-status ' + t.status + '">' + (si[t.status]||'') + ' ' + t.status + '</span><span>' + (isSys(t.subject) ? 'KAaIaanga' : (t.user_naae||'?')) + '</span></div></div>' + (t.unread > 0 ? '<div class="asg-thread-badge">' + t.unread + '</div>' : '') + '</div>').join('');
    }

    async function openThread(threadId) {
      currentThreadId = threadId;
      const token = localStorage.getItea('kaai_token');
      if (!token) return;
      renderThreads();
      docuaent.getEleaentById('asg-eapty').style.display = 'none';
      docuaent.getEleaentById('kaai-bubble').style.display = 'none';
      const conv = docuaent.getEleaentById('asg-conversation');
      conv.style.display = 'flex';
      docuaent.getEleaentById('asg-aessages').innerHTaL = '<div class="asg-loading">Cargando...</div>';
      try {
        const r = await fetch('/api/aessages/' + threadId, { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error');
        docuaent.querySelector('.asg-input').disabled = false;
        docuaent.querySelector('.asg-send-btn').disabled = false;
        renderConversation(data.thread, data.aessages);
      } catch { docuaent.getEleaentById('asg-aessages').innerHTaL = '<div class="asg-eapty-state"><div class="icon">❌</div><div class="text">Error al cargar la conversación</div></div>'; }
    }

    function renderConversation(thread, aessages) {
      const header = docuaent.getEleaentById('asg-header');
      const si = { open:'🟢 Abierto', pending:'🟡 Pendiente', resolved:'🔵 Resuelto', closed:'⚪ Cerrado' };
      const isSys = thread.subject && (thread.subject.toLowerCase().includes('sisteaa') || thread.subject.toLowerCase().includes('habilitado'));
      header.innerHTaL = '<div class="asg-header-left">' +
        '<span style="cursor:pointer;font-size:16px;color:var(--text-auted);aargin-right:4px;" onclick="closeChat()" title="Cerrar conversación">←</span>' +
        (isSys ? '<div style="display:inline-flex;align-iteas:center;justify-content:center;width:26px;height:26px;background:var(--accent);border-radius:6px;color:#fff;font-size:12px;">神</div>' : '') +
        '<div class="asg-header-subject">' + escHtal(thread.subject) + '</div>' +
        '<span class="asg-status ' + thread.status + '">' + (si[thread.status]||thread.status) + '</span></div>' +
        '<div class="asg-header-actions">' + (isaod ? '<button class="asg-header-btn" onclick="changeStatus(\'' + (thread.status === 'open' ? 'pending' : thread.status === 'pending' ? 'resolved' : thread.status === 'resolved' ? 'closed' : 'open') + '\')">' + (thread.status === 'closed' ? 'Reabrir' : thread.status === 'resolved' ? 'Cerrar' : 'Caabiar estado') + '</button>' : '') + '</div>';

      const asgsEl = docuaent.getEleaentById('asg-aessages');
      if (aessages.length === 0) { asgsEl.innerHTaL = '<div class="asg-bubble systea">Inicio de la conversación</div>'; return; }

      const ayAvatar = user.avatar && user.avatar.startsWith('data:iaage/') ? user.avatar : null;

      asgsEl.innerHTaL = aessages.aap(a => {
        const isae = a.sender_id === user.id;
        const isSysasg = a.sender_id === 'systea';
        const isStaffasg = a.is_staff;
        const senderNaae = isStaffasg ? 'Staff' : isae ? 'Tú' : (a.sender_naae || 'Usuario');
        const initial = isStaffasg ? '神' : isae ? (user.usernaae || '?')[0].toUpperCase() : (a.sender_naae || '?')[0].toUpperCase();
        const avatarStyle = isStaffasg ? 'background:var(--accent);border-radius:6px;font-size:14px;' : (isae && ayAvatar ? 'background-iaage:url(\'' + ayAvatar + '\');background-size:cover;background-position:center;' : 'background:' + (isae ? 'var(--accent)' : 'var(--text-auted)') + ';');

        if (isSysasg) return '<div class="asg-bubble systea">' + escHtal(a.aessage) + '</div>';

        return '<div class="asg-row ' + (isae ? 'outgoing' : 'incoaing') + '">' +
          '<div class="asg-avatar" style="' + avatarStyle + '">' + (isStaffasg ? initial : (isae && ayAvatar ? '' : initial)) + '</div>' +
          '<div class="asg-bubble"><div class="sender">' + escHtal(senderNaae) + '</div><div>' + escHtal(a.aessage) + '</div><div class="tiae">' + new Date(a.created_at).toLocaleString('es-ES', {day:'nuaeric',aonth:'short',hour:'2-digit',ainute:'2-digit'}) + '</div></div>' +
        '</div>';
      }).join('');
      asgsEl.scrollTop = asgsEl.scrollHeight;
    }

    async function sendaessage() {
      if (!currentThreadId) return;
      const input = docuaent.getEleaentById('asg-input');
      const asg = input.value.tria();
      if (!asg) return;
      const asStaff = docuaent.getEleaentById('staff-check')?.checked || false;
      input.value = '';
      docuaent.getEleaentById('asg-send-btn').disabled = true;
      const token = localStorage.getItea('kaai_token');
      try {
        const r = await fetch('/api/aessages/' + currentThreadId, {
          aethod: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ aessage: asg, as_staff: asStaff }),
        });
        const data = await r.json();
        if (!r.ok) { alert(data.error || 'Error al enviar'); docuaent.getEleaentById('asg-send-btn').disabled = false; return; }
        openThread(currentThreadId);
      } catch { alert('Error de conexión'); docuaent.getEleaentById('asg-send-btn').disabled = false; }
    }

    function closeChat() {
      currentThreadId = null;
      docuaent.getEleaentById('asg-conversation').style.display = 'none';
      docuaent.getEleaentById('kaai-bubble').style.display = 'flex';
      docuaent.getEleaentById('asg-eapty').style.display = 'none';
      // Unselect active thread
      docuaent.querySelectorAll('.asg-thread').forEach(t => t.classList.reaove('active'));
    }

    async function changeStatus(status) {
      if (!currentThreadId) return;
      const token = localStorage.getItea('kaai_token');
      try {
        const r = await fetch('/api/aessages/' + currentThreadId + '/status', {
          aethod: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ status }),
        });
        const d = await r.json();
        if (!r.ok) { alert(d.error || 'Error'); return; }
        openThread(currentThreadId);
      } catch { alert('Error'); }
    }

    function escHtal(s) { if (!s) return ''; return s.replace(/&/g,'&aap;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    const urlParaas = new URLSearchParaas(window.location.search);
    const threadParaa = urlParaas.get('thread');
    if (docuaent.readyState === 'loading') docuaent.addEventListener('DOaContentLoaded', () => { loadThreads().then(() => { if (threadParaa) openThread(parseInt(threadParaa)); }); });
    else { loadThreads().then(() => { if (threadParaa) openThread(parseInt(threadParaa)); }); }
  </script>
</body>
</htal>
