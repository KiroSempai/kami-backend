<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Comunidad · KamiTales</title>
  <meta name="description" content="La comunidad de KamiTales: publicaciones, comunidades de cada obra, mensajes y novedades.">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/kami.css">
  <script src="/js/kami-shell.js"></script>
  <script src="/socket.io/socket.io.js" defer></script>
  <style>
    [hidden] { display: none !important; }
    .cm { display: grid; grid-template-columns: 230px minmax(0, 1fr) 320px; gap: var(--k-6); max-width: 1260px; margin: 0 auto; padding: var(--k-5) max(16px, env(safe-area-inset-left, 0px)) var(--k-12); align-items: start; }

    /* ── Menú lateral ─────────────────────────────────────── */
    .cm-nav { position: sticky; top: calc(var(--k-nav-h) + var(--k-5)); display: grid; gap: 2px; }
    .cm-nav a { display: flex; align-items: center; gap: var(--k-3); padding: 11px var(--k-3); border-radius: var(--k-r-md); color: var(--k-text-2); text-decoration: none; font: 600 var(--k-fs-md)/1 var(--k-font-body); position: relative; transition: background var(--k-t-fast), color var(--k-t-fast); }
    .cm-nav a i { font-size: 21px; width: 22px; }
    .cm-nav a:hover { background: rgb(var(--k-ink) / .05); color: var(--k-text); }
    .cm-nav a[aria-current="page"] { color: var(--k-text); background: var(--k-accent-soft); }
    .cm-nav a[aria-current="page"] i { color: var(--k-accent); }
    .cm-badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center; font: 700 11px/1 var(--k-font-body); background: var(--k-accent-fill); color: var(--k-on-accent); }
    .cm-nav .k-btn { margin-top: var(--k-4); }

    /* ── Columna central ──────────────────────────────────── */
    .cm-main { min-width: 0; }
    .cm-head { position: sticky; top: var(--k-nav-h); z-index: 6; background: color-mix(in srgb, var(--k-bg) 88%, transparent); backdrop-filter: blur(12px); margin: calc(var(--k-5) * -1) 0 0; padding-top: var(--k-5); }
    .cm-head h1 { margin: 0 0 var(--k-3); font: 900 clamp(1.8rem, 4vw, 2.4rem)/1 var(--k-font-display); text-transform: uppercase; display: flex; align-items: center; gap: var(--k-3); }
    .cm-head h1 .back { margin-left: -8px; }
    .cm-tabs { margin-bottom: 0; }
    .cm-list { display: grid; gap: var(--k-3); padding-top: var(--k-4); }
    .cm-more { display: grid; place-items: center; padding: var(--k-5); color: var(--k-text-3); font-size: var(--k-fs-sm); }

    /* Publicación */
    .po { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: var(--k-3); padding: var(--k-4) var(--k-5); border-radius: var(--k-r-lg); border: 1px solid var(--k-line); background: var(--k-surface-1); transition: border-color var(--k-t-fast); position: relative; }
    .po.is-link { cursor: pointer; }
    .po.is-link:hover { border-color: var(--k-line-2); }
    .po .k-avatar { --_s: 44px; }
    .po-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: var(--k-fs-sm); min-width: 0; }
    .po-top a.n { color: var(--k-text); font-weight: 700; text-decoration: none; }
    .po-top a.n:hover { text-decoration: underline; }
    .po-top .h, .po-top time { color: var(--k-text-3); }
    .po-ctx { font-size: var(--k-fs-xs); color: var(--k-text-3); display: flex; align-items: center; gap: 6px; margin: -4px 0 6px; grid-column: 1 / -1; padding-left: 56px; }
    .po-body { margin: 6px 0 0; font-size: var(--k-fs-md); line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; color: var(--k-text); }
    .po-body a { color: var(--k-accent); text-decoration: none; }
    .po-body a:hover { text-decoration: underline; }
    .po-title { margin: 6px 0 0; font-weight: 800; font-size: var(--k-fs-lg); }
    .po-media { margin-top: var(--k-3); border-radius: var(--k-r-md); overflow: hidden; border: 1px solid var(--k-line); max-height: 520px; background: var(--k-surface-2); }
    .po-media img { width: 100%; max-height: 520px; object-fit: cover; display: block; }
    .po-obra { display: inline-flex; align-items: center; gap: 6px; margin-top: var(--k-2); padding: 4px 10px 4px 4px; border-radius: 99px; background: rgb(var(--k-ink) / .05); border: 1px solid var(--k-line); color: var(--k-text-2); font-size: var(--k-fs-xs); text-decoration: none; max-width: 100%; }
    .po-obra img { width: 20px; height: 28px; object-fit: cover; border-radius: 4px; }
    .po-obra span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .po-spoiler .po-body, .po-spoiler .po-media { filter: blur(10px); user-select: none; }
    .po-spoiler-btn { margin-top: var(--k-2); }
    .po-acts { display: flex; justify-content: space-between; max-width: 440px; margin-top: var(--k-3); margin-left: -8px; }
    .po-act { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; border: 0; border-radius: 99px; background: none; color: var(--k-text-3); font: 600 var(--k-fs-xs)/1 var(--k-font-body); cursor: pointer; transition: color var(--k-t-fast), background var(--k-t-fast); font-variant-numeric: tabular-nums; }
    .po-act i { font-size: 18px; }
    .po-act:hover { background: rgb(var(--k-ink) / .06); color: var(--k-text); }
    .po-act[data-a="reply"]:hover { color: var(--k-info); }
    .po-act[data-a="repost"]:hover, .po-act[data-a="repost"][aria-pressed="true"] { color: var(--k-ok); }
    .po-act[data-a="like"]:hover, .po-act[data-a="like"][aria-pressed="true"] { color: var(--k-accent); }
    .po-act[data-a="save"]:hover, .po-act[data-a="save"][aria-pressed="true"] { color: var(--k-gold); }
    .po-act[aria-pressed="true"] i { font-weight: 700; }
    .po.is-big { padding: var(--k-5) var(--k-6); }
    .po.is-big .po-body { font-size: var(--k-fs-lg); }
    .po-thread { border-left: 2px solid var(--k-line-2); margin-left: 21px; padding-left: var(--k-4); display: grid; gap: var(--k-3); }

    /* Editor de publicaciones */
    .cp { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: var(--k-3); padding: var(--k-4) var(--k-5); border-radius: var(--k-r-lg); border: 1px solid var(--k-line); background: var(--k-surface-1); }
    .cp .k-avatar { --_s: 44px; }
    .cp textarea { width: 100%; min-height: 56px; resize: none; border: 0; background: none; color: var(--k-text); font: 400 var(--k-fs-lg)/1.5 var(--k-font-body); padding: 8px 0; outline: none; }
    .cp textarea::placeholder { color: var(--k-text-3); }
    .cp-extras { display: grid; gap: var(--k-2); }
    .cp-prev { position: relative; border-radius: var(--k-r-md); overflow: hidden; border: 1px solid var(--k-line); max-width: 360px; }
    .cp-prev img { width: 100%; display: block; max-height: 260px; object-fit: cover; }
    .cp-prev button { position: absolute; top: 6px; right: 6px; }
    .cp-bar { display: flex; align-items: center; gap: 2px; border-top: 1px solid var(--k-line); padding-top: var(--k-2); margin-top: var(--k-2); flex-wrap: wrap; }
    .cp-bar .k-btn--icon { color: var(--k-accent); }
    .cp-bar .k-btn--icon[aria-pressed="true"] { background: var(--k-accent-soft); }
    .cp-count { margin-left: auto; margin-right: var(--k-3); font-size: var(--k-fs-xs); color: var(--k-text-3); font-variant-numeric: tabular-nums; }
    .cp-count.is-warn { color: var(--k-warn); } .cp-count.is-bad { color: var(--k-bad); }
    .cp-pop { position: relative; }
    .cp-panel { margin-top: var(--k-2); padding: var(--k-3); border-radius: var(--k-r-md); border: 1px solid var(--k-line-2); background: var(--k-surface-2); display: grid; gap: var(--k-2); }
    .cp-gifs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; max-height: 260px; overflow-y: auto; }
    .cp-gifs button { padding: 0; border: 0; border-radius: 8px; overflow: hidden; cursor: pointer; aspect-ratio: 4 / 3; background: var(--k-surface-1); }
    .cp-gifs img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cp-obras { display: grid; gap: 2px; max-height: 240px; overflow-y: auto; }
    .cp-obras button { display: grid; grid-template-columns: 30px 1fr; gap: var(--k-2); align-items: center; padding: 6px; border: 0; border-radius: var(--k-r-sm); background: none; color: var(--k-text); text-align: left; cursor: pointer; font: 500 var(--k-fs-sm)/1.3 var(--k-font-body); }
    .cp-obras button:hover { background: rgb(var(--k-ink) / .06); }
    .cp-obras img, .cp-obras .ph { width: 30px; height: 42px; border-radius: 4px; object-fit: cover; background: var(--k-surface-1); }
    .cp-ctx { font-size: var(--k-fs-xs); color: var(--k-text-3); display: flex; align-items: center; gap: 6px; }

    /* Explorar y comunidades */
    .cm-search { margin-top: var(--k-2); }
    .cm-sec { display: grid; gap: var(--k-3); margin-top: var(--k-6); }
    .cm-sec > h2 { margin: 0; font: 800 var(--k-fs-lg)/1 var(--k-font-display); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; justify-content: space-between; gap: var(--k-2); }
    .cm-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--k-3); align-items: center; padding: var(--k-3); border-radius: var(--k-r-md); text-decoration: none; color: inherit; transition: background var(--k-t-fast); }
    .cm-row:hover { background: rgb(var(--k-ink) / .05); }
    .cm-row b { display: block; font-size: var(--k-fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cm-row small { color: var(--k-text-3); font-size: var(--k-fs-xs); }
    .cm-row img.cv { width: 40px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--k-surface-2); }
    .cg { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: var(--k-3); }
    .cc { display: grid; border-radius: var(--k-r-lg); border: 1px solid var(--k-line); background: var(--k-surface-1); overflow: hidden; text-decoration: none; color: inherit; transition: border-color var(--k-t-fast), transform var(--k-t) var(--k-ease); }
    .cc:hover { border-color: var(--k-accent-line); transform: translateY(-2px); }
    .cc-ban { height: 92px; background: radial-gradient(80% 120% at 20% 0%, color-mix(in srgb, var(--k-accent) 45%, transparent), transparent 70%), var(--k-surface-2) center / cover; }
    .cc-body { display: grid; grid-template-columns: 52px 1fr; gap: var(--k-3); padding: 0 var(--k-4) var(--k-4); margin-top: -24px; align-items: end; }
    .cc-ava { width: 52px; height: 52px; border-radius: 14px; border: 3px solid var(--k-surface-1); background: var(--k-surface-2) center / cover; display: grid; place-items: center; font: 800 18px/1 var(--k-font-display); }
    .cc b { display: block; font-size: var(--k-fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cc small { color: var(--k-text-3); font-size: var(--k-fs-xs); }
    .cc p { grid-column: 1 / -1; margin: var(--k-2) 0 0; color: var(--k-text-2); font-size: var(--k-fs-xs); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Detalle de comunidad */
    .cd-hero { position: relative; border-radius: var(--k-r-lg); overflow: hidden; border: 1px solid var(--k-line); background: var(--k-surface-1); }
    .cd-ban { height: clamp(120px, 22vw, 200px); background: radial-gradient(80% 120% at 20% 0%, color-mix(in srgb, var(--k-accent) 45%, transparent), transparent 70%), var(--k-surface-2) center / cover; position: relative; }
    .cd-ban .k-btn { position: absolute; right: 10px; top: 10px; }
    .cd-info { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--k-4); padding: var(--k-3) var(--k-5) var(--k-5); align-items: end; }
    .cd-ava { margin-top: -54px; width: 84px; height: 84px; border-radius: 20px; border: 4px solid var(--k-surface-1); background: var(--k-surface-2) center / cover; display: grid; place-items: center; font: 900 30px/1 var(--k-font-display); position: relative; }
    .cd-ava label { position: absolute; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / .45); opacity: 0; cursor: pointer; border-radius: inherit; color: #fff; transition: opacity var(--k-t-fast); }
    .cd-ava:hover label, .cd-ava label:focus-within { opacity: 1; }
    .cd-info h2 { margin: 0; font: 900 clamp(1.4rem, 3.4vw, 2rem)/1 var(--k-font-display); text-transform: uppercase; overflow-wrap: anywhere; }
    .cd-info small { color: var(--k-text-3); font-size: var(--k-fs-sm); }
    .cd-desc { padding: 0 var(--k-5) var(--k-5); margin: 0; color: var(--k-text-2); font-size: var(--k-fs-sm); line-height: 1.6; }
    .cd-chat { display: grid; gap: var(--k-2); max-height: 60vh; overflow-y: auto; padding: var(--k-3); border-radius: var(--k-r-lg); border: 1px solid var(--k-line); background: var(--k-surface-1); }

    /* Notificaciones */
    .nt { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: var(--k-3); padding: var(--k-4); border-radius: var(--k-r-md); text-decoration: none; color: inherit; border: 1px solid transparent; }
    .nt:hover { background: rgb(var(--k-ink) / .04); }
    .nt.is-new { background: var(--k-accent-soft); border-color: var(--k-accent-line); }
    .nt .ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: rgb(var(--k-ink) / .06); }
    .nt p { margin: 0; font-size: var(--k-fs-sm); line-height: 1.5; }
    .nt time { font-size: var(--k-fs-xs); color: var(--k-text-3); }

    /* Mensajes */
    .dm { display: grid; grid-template-columns: 300px minmax(0, 1fr); border: 1px solid var(--k-line); border-radius: var(--k-r-lg); overflow: hidden; background: var(--k-surface-1); height: calc(100dvh - var(--k-nav-h) - 170px); min-height: 420px; margin-top: var(--k-4); }
    .dm-list { border-right: 1px solid var(--k-line); overflow-y: auto; }
    .dm-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--k-3); align-items: center; padding: var(--k-3) var(--k-4); text-decoration: none; color: inherit; border-bottom: 1px solid var(--k-line); }
    .dm-item:hover { background: rgb(var(--k-ink) / .04); }
    .dm-item[aria-current="true"] { background: var(--k-accent-soft); }
    .dm-item b { display: block; font-size: var(--k-fs-sm); }
    .dm-item small { display: block; color: var(--k-text-3); font-size: var(--k-fs-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dm-item .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--k-accent); box-shadow: 0 0 8px var(--k-accent); }
    .dm-chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }
    .dm-chat-head { display: flex; align-items: center; gap: var(--k-3); padding: var(--k-3) var(--k-4); border-bottom: 1px solid var(--k-line); }
    .dm-chat-head a { color: var(--k-text); font-weight: 700; text-decoration: none; }
    .dm-msgs { overflow-y: auto; padding: var(--k-4); display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 78%; padding: 8px 12px; border-radius: 16px; font-size: var(--k-fs-sm); line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; background: rgb(var(--k-ink) / .07); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.me { align-self: flex-end; background: var(--k-accent-fill); color: var(--k-on-accent); border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
    .msg time { display: block; font-size: 10.5px; opacity: .7; margin-top: 2px; text-align: right; }
    .msg-day { align-self: center; font-size: var(--k-fs-xs); color: var(--k-text-3); margin: var(--k-2) 0; }
    .dm-send { display: flex; gap: var(--k-2); padding: var(--k-3); border-top: 1px solid var(--k-line); align-items: flex-end; }
    .dm-send textarea { flex: 1; resize: none; max-height: 140px; }
    .dm-empty { display: grid; place-items: center; text-align: center; color: var(--k-text-3); padding: var(--k-8); }

    /* Lateral derecho */
    .cm-side { position: sticky; top: calc(var(--k-nav-h) + var(--k-5)); display: grid; gap: var(--k-4); }
    .cm-side .k-card h3 { margin: 0 0 var(--k-3); font: 700 var(--k-fs-xs)/1 var(--k-font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--k-text-3); }
    .cm-trend { display: block; padding: var(--k-2) var(--k-2); margin: 0 calc(var(--k-2) * -1); border-radius: var(--k-r-sm); text-decoration: none; color: inherit; }
    .cm-trend:hover { background: rgb(var(--k-ink) / .05); }
    .cm-trend small { display: block; color: var(--k-text-3); font-size: var(--k-fs-xs); }
    .cm-trend b { display: block; font-size: var(--k-fs-sm); font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .cm-fab { display: none; }

    @media (max-width: 1180px) { .cm { grid-template-columns: 220px minmax(0, 1fr); } .cm-side { display: none; } }
    @media (max-width: 860px) {
      .cm { grid-template-columns: minmax(0, 1fr); padding-top: 0; }
      .cm-nav { position: sticky; top: var(--k-nav-h); z-index: 7; display: flex; overflow-x: auto; scrollbar-width: none; gap: var(--k-1); padding: var(--k-2) 16px; margin: 0 -16px; background: color-mix(in srgb, var(--k-bg) 92%, transparent); backdrop-filter: blur(12px); }
      .cm-nav::-webkit-scrollbar { display: none; }
      .cm-nav a { flex: none; padding: 8px 12px; font-size: var(--k-fs-sm); border: 1px solid var(--k-line); border-radius: 99px; }
      .cm-nav a i { font-size: 17px; width: auto; }
      .cm-nav .k-btn { display: none; }
      .cm-head { top: calc(var(--k-nav-h) + 52px); margin-top: 0; padding-top: var(--k-3); }
      .cm-fab { display: grid; place-items: center; position: fixed; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--k-accent-fill); color: var(--k-on-accent); font-size: 26px; box-shadow: var(--k-glow), 0 10px 24px -6px rgb(0 0 0 / .6); cursor: pointer; }
      .po { padding: var(--k-3) var(--k-4); grid-template-columns: 38px minmax(0, 1fr); }
      .po .k-avatar { --_s: 38px; }
      .po-ctx { padding-left: 50px; }
      .dm { grid-template-columns: minmax(0, 1fr); height: calc(100dvh - var(--k-nav-h) - 210px); }
      .dm.has-chat .dm-list, .dm:not(.has-chat) .dm-chat { display: none; }
      .cd-info { grid-template-columns: auto minmax(0, 1fr); }
      .cd-info > .k-btn, .cd-info > .k-row { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
<div class="cm">
  <nav class="cm-nav" aria-label="Secciones de Comunidad" id="cm-nav">
    <a href="#inicio" data-r="inicio"><i class="ti ti-home" aria-hidden="true"></i>Inicio</a>
    <a href="#explorar" data-r="explorar"><i class="ti ti-search" aria-hidden="true"></i>Explorar</a>
    <a href="#comunidades" data-r="comunidades"><i class="ti ti-users-group" aria-hidden="true"></i>Comunidades</a>
    <a href="#notificaciones" data-r="notificaciones"><i class="ti ti-bell" aria-hidden="true"></i>Avisos<span class="cm-badge" id="b-notif" hidden></span></a>
    <a href="#mensajes" data-r="mensajes"><i class="ti ti-message" aria-hidden="true"></i>Mensajes<span class="cm-badge" id="b-dm" hidden></span></a>
    <a href="#guardados" data-r="guardados"><i class="ti ti-bookmark" aria-hidden="true"></i>Guardados</a>
    <button class="k-btn k-btn--primary k-btn--lg k-btn--block" type="button" data-compose><i class="ti ti-pencil-plus" aria-hidden="true"></i>Publicar</button>
  </nav>

  <main class="cm-main" id="k-main">
    <header class="cm-head" id="cm-head"></header>
    <div id="cm-view"></div>
  </main>

  <aside class="cm-side" aria-label="Destacado">
    <div class="k-card" id="sd-mine" hidden><h3>Tus comunidades</h3><div id="sd-mine-l"></div></div>
    <div class="k-card" id="sd-trend" hidden><h3>Lo más comentado</h3><div id="sd-trend-l"></div></div>
    <div class="k-card" id="sd-news" hidden><h3>Avisos del equipo</h3><div id="sd-news-l"></div></div>
    <div class="k-card" id="sd-sugg" hidden><h3>Comunidades para ti</h3><div id="sd-sugg-l"></div></div>
  </aside>
</div>
<button class="cm-fab" type="button" data-compose aria-label="Publicar"><i class="ti ti-pencil-plus" aria-hidden="true"></i></button>

<dialog class="k-modal" id="cp-dlg" aria-labelledby="cp-dlg-t" style="width:min(600px,calc(100vw - 24px))">
  <div class="k-modal__head"><h2 class="k-h3" id="cp-dlg-t" style="margin:0">Nueva publicación</h2><button class="k-btn k-btn--quiet k-btn--icon" type="button" data-close aria-label="Cerrar"><i class="ti ti-x" aria-hidden="true"></i></button></div>
  <div class="k-modal__body" id="cp-dlg-body" style="padding-top:var(--k-3)"></div>
</dialog>

<script>
(function () {
  'use strict';
  // Si una carga termina después de cambiar de sección, escribe en un elemento suelto en vez de fallar
  var $ = function (id) { return document.getElementById(id) || document.createElement('div'); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var toast = function (m, t) { if (window.KAMI && KAMI.toast) KAMI.toast(m, t); };
  var nf = new Intl.NumberFormat('es-ES'), compact = new Intl.NumberFormat('es-ES', { notation: 'compact', maximumFractionDigits: 1 });
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } } };
  var me = (function () { try { return JSON.parse(store.get('kami_user') || 'null'); } catch (e) { return null; } })();
  var token = store.get('kami_token'), logged = !!token;
  var MAX = 1000;

  function api(url, opt) { return fetch(url, opt).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || 'Error ' + r.status); e.status = r.status; throw e; } return d; }); }); }
  function send(url, method, body) { return api(url, { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }); }
  function isImg(v) { return typeof v === 'string' && /^(data:image\/|https?:\/\/|\/)/.test(v); }
  function ava(name, a, cls) { return '<span class="k-avatar ' + (cls || '') + '">' + (isImg(a) ? '<img src="' + esc(a) + '" alt="" loading="lazy">' : esc(String(a && a.length <= 3 ? a : (name || '?').slice(0, 2)).toUpperCase())) + '</span>'; }
  function ago(d) {
    var s = (Date.now() - new Date(d)) / 1000; if (isNaN(s)) return '';
    if (s < 60) return 'ahora'; if (s < 3600) return Math.round(s / 60) + ' min'; if (s < 86400) return Math.round(s / 3600) + ' h'; if (s < 604800) return Math.round(s / 86400) + ' d';
    return new Date(d).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
  }
  function rich(text) {
    return esc(text)
      .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener noreferrer nofollow">$1</a>')
      .replace(/(^|\s)#([\p{L}\p{N}_]{2,40})/gu, '$1<a href="#explorar?q=%23$2">#$2</a>')
      .replace(/(^|\s)@([\w.-]{2,30})/g, '$1<a href="/perfil/$2">@$2</a>');
  }
  function goLogin() { location.href = '/acceder?next=' + encodeURIComponent('/comunidad' + location.hash); }
  var ROLE = { admin: ['Admin', 'accent'], moderator: ['Mod', 'info'], company: ['Editorial', 'gold'] };
  function roleBadge(r) { var x = ROLE[r]; return x ? '<span class="k-badge k-badge--' + x[1] + '">' + x[0] + '</span>' : ''; }
  function emptyBox(icon, title, text, action) { return '<div class="k-empty"><i class="ti ti-' + icon + '" aria-hidden="true"></i><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' + (action || '') + '</div>'; }

  /* ═══ Tarjeta de publicación ══════════════════════════════════ */
  var POSTS = {};
  function postHTML(p, opts) {
    opts = opts || {};
    POSTS[p.id] = p;
    var user = p.user || p.username || 'Anónimo', text = p.text != null ? p.text : (p.content || '');
    var media = p.media_url && isImg(p.media_url) && !/^data:/.test(p.media_url) ? p.media_url : null;
    var obra = p.manga && p.manga.id ? p.manga : (p.manga_id ? { id: p.manga_id, title: p.manga_title || 'Ver obra' } : null);
    var spoiler = (p.spoiler || p.is_spoiler) && !opts.revealed;
    var likes = p.likes != null ? p.likes : (p.like_count || 0), reps = p.reposts != null ? p.reposts : (p.repost_count || 0), replies = p.replies != null ? p.replies : (p.reply_count || 0);
    var ctx = '';
    if (p.es_repost_del_perfil || opts.repostBy) ctx = '<div class="po-ctx"><i class="ti ti-repeat" aria-hidden="true"></i>' + esc(opts.repostBy || 'Compartido') + '</div>';
    if (p.is_global_announcement) ctx = '<div class="po-ctx" style="color:var(--k-gold)"><i class="ti ti-speakerphone" aria-hidden="true"></i>Aviso del equipo</div>';
    return '<article class="po' + (opts.big ? ' is-big' : ' is-link') + (spoiler ? ' po-spoiler' : '') + '" data-post="' + esc(p.id) + '">' + ctx +
      '<a href="/perfil/' + encodeURIComponent(user) + '" tabindex="-1" aria-hidden="true" data-stop>' + ava(user, p.avatar) + '</a>' +
      '<div style="min-width:0">' +
        '<div class="po-top"><a class="n" href="/perfil/' + encodeURIComponent(user) + '" data-stop>' + esc(user) + '</a>' + roleBadge(p.author_role) + '<span class="h">@' + esc(String(user).toLowerCase()) + '</span><span class="h" aria-hidden="true">·</span><time datetime="' + esc(p.created_at) + '" title="' + esc(new Date(p.created_at).toLocaleString('es-ES')) + '">' + ago(p.created_at) + '</time></div>' +
        (p.title ? '<p class="po-title">' + esc(p.title) + '</p>' : '') +
        (text ? '<p class="po-body">' + rich(text) + '</p>' : '') +
        (media ? '<div class="po-media"><img src="' + esc(media) + '" alt="" loading="lazy"></div>' : '') +
        (spoiler ? '<button class="k-btn k-btn--secondary k-btn--sm po-spoiler-btn" type="button" data-a="reveal"><i class="ti ti-eye" aria-hidden="true"></i>Contiene spoilers · ver</button>' : '') +
        (obra ? '<div><a class="po-obra" href="/obra/' + encodeURIComponent(obra.id) + '" data-stop>' + (obra.cover ? '<img src="' + esc(obra.cover) + '" alt="">' : '<i class="ti ti-book" aria-hidden="true" style="margin-left:6px"></i>') + '<span>' + esc(obra.title) + (p.chapter || p.chapter_number ? ' · cap. ' + esc(p.chapter || p.chapter_number) : '') + '</span></a></div>' : '') +
        '<div class="po-acts">' +
          '<button class="po-act" type="button" data-a="reply" aria-label="Responder (' + replies + ')"><i class="ti ti-message-circle" aria-hidden="true"></i><span>' + (replies ? compact.format(replies) : '') + '</span></button>' +
          '<button class="po-act" type="button" data-a="repost" aria-pressed="' + !!p.user_has_reposted + '" aria-label="Compartir (' + reps + ')"><i class="ti ti-repeat" aria-hidden="true"></i><span>' + (reps ? compact.format(reps) : '') + '</span></button>' +
          '<button class="po-act" type="button" data-a="like" aria-pressed="' + !!p.user_has_liked + '" aria-label="Me gusta (' + likes + ')"><i class="ti ti-heart' + (p.user_has_liked ? '-filled' : '') + '" aria-hidden="true"></i><span>' + (likes ? compact.format(likes) : '') + '</span></button>' +
          '<button class="po-act" type="button" data-a="save" aria-pressed="' + !!p.user_has_bookmarked + '" aria-label="Guardar"><i class="ti ti-bookmark' + (p.user_has_bookmarked ? '-filled' : '') + '" aria-hidden="true"></i></button>' +
          '<button class="po-act" type="button" data-a="share" aria-label="Copiar enlace"><i class="ti ti-share" aria-hidden="true"></i></button>' +
        '</div>' +
      '</div></article>';
  }
  function bump(btn, on, delta) {
    btn.setAttribute('aria-pressed', String(on));
    var i = btn.querySelector('i'); if (i) i.className = i.className.replace(/-filled\b/, '') + (on && /heart|bookmark/.test(i.className) ? '-filled' : '');
    var s = btn.querySelector('span'); if (s && delta != null) { var n = Math.max(0, (parseInt((s.textContent || '0').replace(/\D/g, ''), 10) || 0) + delta); s.textContent = n ? compact.format(n) : ''; }
  }
  document.addEventListener('click', function (e) {
    var card = e.target.closest('.po'); if (!card) return;
    if (e.target.closest('[data-stop]') || e.target.closest('.po-body a')) return;
    var id = card.dataset.post, p = POSTS[id], btn = e.target.closest('[data-a]');
    if (!btn) { if (card.classList.contains('is-link') && !getSelection().toString()) location.hash = 'post/' + id; return; }
    e.preventDefault();
    var a = btn.dataset.a;
    if (a === 'reveal') { card.classList.remove('po-spoiler'); btn.remove(); return; }
    if (a === 'share') { var url = location.origin + '/comunidad#post/' + id; (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { toast('Enlace copiado', 'ok'); }, function () { prompt('Copia el enlace:', url); }); return; }
    if (a === 'reply') { if (card.classList.contains('is-link')) location.hash = 'post/' + id; else { var t = document.querySelector('#reply-box textarea'); if (t) t.focus(); } return; }
    if (!logged) return goLogin();
    var on = btn.getAttribute('aria-pressed') !== 'true';
    bump(btn, on, a === 'save' ? null : (on ? 1 : -1));
    var req = a === 'repost' ? send('/api/feed/repost', 'POST', { post_id: +id }) : send('/api/feed/interact', 'POST', { post_id: +id, interaction_type: a === 'save' ? 'bookmark' : 'like' });
    req.then(function () {
      if (p) { if (a === 'like') p.user_has_liked = on; if (a === 'save') p.user_has_bookmarked = on; if (a === 'repost') p.user_has_reposted = on; }
      if (a === 'save') toast(on ? 'Guardada en tus guardados' : 'Quitada de guardados', 'ok');
      if (a === 'repost' && on) toast('Compartida en tu perfil', 'ok');
    }).catch(function (er) { bump(btn, !on, a === 'save' ? null : (on ? -1 : 1)); toast(er.message, 'bad'); });
  });

  // Vistas: se envían en lote las publicaciones que han aparecido en pantalla
  var seen = new Set(), pendingViews = [], viewTimer;
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (ents) {
    ents.forEach(function (en) { if (en.isIntersecting) { var id = en.target.dataset.post; io.unobserve(en.target); if (id && !seen.has(id)) { seen.add(id); pendingViews.push(+id); } } });
    if (pendingViews.length && logged) { clearTimeout(viewTimer); viewTimer = setTimeout(function () { var ids = pendingViews.splice(0); send('/api/feed/track-views', 'POST', { post_ids: ids }).catch(function () {}); }, 1500); }
  }, { threshold: .6 }) : null;
  function watch(box) { if (io) box.querySelectorAll('.po[data-post]').forEach(function (el) { io.observe(el); }); }

  /* ═══ Editor de publicaciones ═════════════════════════════════ */
  function composer(box, opts) {
    opts = opts || {};
    if (!logged) { box.innerHTML = '<div class="cp" style="grid-template-columns:1fr;text-align:center"><p class="k-muted" style="margin:0">Inicia sesión para ' + (opts.parent ? 'responder' : 'publicar') + '.</p><a class="k-btn k-btn--primary" href="/acceder?next=' + encodeURIComponent('/comunidad' + location.hash) + '" style="justify-self:center">Iniciar sesión</a></div>'; return; }
    var st = { media: null, obra: opts.obra || null, spoiler: false, busy: false };
    box.innerHTML = '<form class="cp" novalidate>' + ava(me && me.username, me && me.avatar) +
      '<div style="min-width:0">' +
        (opts.ctx ? '<div class="cp-ctx">' + opts.ctx + '</div>' : '') +
        '<label class="k-visually-hidden" for="' + (opts.id || 'cp') + '-t">' + (opts.parent ? 'Escribe tu respuesta' : 'Escribe tu publicación') + '</label>' +
        '<textarea id="' + (opts.id || 'cp') + '-t" maxlength="' + MAX + '" rows="2" placeholder="' + esc(opts.placeholder || '¿Qué estás leyendo? Comparte una teoría, fanart o recomendación…') + '"></textarea>' +
        '<div class="cp-extras"></div>' +
        '<div class="cp-panel" data-panel hidden></div>' +
        '<div class="cp-bar">' +
          '<label class="k-btn k-btn--quiet k-btn--icon k-btn--sm" title="Imagen"><i class="ti ti-photo" aria-hidden="true"></i><span class="k-visually-hidden">Añadir imagen</span><input type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="k-visually-hidden" data-file></label>' +
          '<button class="k-btn k-btn--quiet k-btn--icon k-btn--sm" type="button" data-tool="gif" aria-pressed="false" title="GIF"><i class="ti ti-gif" aria-hidden="true"></i><span class="k-visually-hidden">Añadir GIF</span></button>' +
          (opts.obra ? '' : '<button class="k-btn k-btn--quiet k-btn--icon k-btn--sm" type="button" data-tool="obra" aria-pressed="false" title="Etiquetar una obra"><i class="ti ti-book" aria-hidden="true"></i><span class="k-visually-hidden">Etiquetar una obra</span></button>') +
          '<button class="k-btn k-btn--quiet k-btn--icon k-btn--sm" type="button" data-tool="spoiler" aria-pressed="false" title="Marcar como spoiler"><i class="ti ti-eye-off" aria-hidden="true"></i><span class="k-visually-hidden">Marcar como spoiler</span></button>' +
          '<span class="cp-count" aria-live="polite"></span>' +
          '<button class="k-btn k-btn--primary k-btn--sm" type="submit" disabled>' + (opts.parent ? 'Responder' : 'Publicar') + '</button>' +
        '</div>' +
      '</div></form>';
    var form = box.querySelector('form'), ta = form.querySelector('textarea'), extras = form.querySelector('.cp-extras'), panel = form.querySelector('[data-panel]'), count = form.querySelector('.cp-count'), submit = form.querySelector('[type=submit]');
    function refresh() {
      var n = ta.value.length; count.textContent = n > MAX * .8 ? (MAX - n) : '';
      count.className = 'cp-count' + (MAX - n < 0 ? ' is-bad' : MAX - n < 50 ? ' is-warn' : '');
      submit.disabled = st.busy || (!ta.value.trim()) || n > MAX;
      ta.style.height = 'auto'; ta.style.height = Math.min(320, ta.scrollHeight) + 'px';
      extras.innerHTML = (st.media ? '<div class="cp-prev"><img src="' + esc(st.media) + '" alt=""><button class="k-btn k-btn--secondary k-btn--icon k-btn--sm" type="button" data-rm="media" aria-label="Quitar imagen"><i class="ti ti-x" aria-hidden="true"></i></button></div>' : '') +
        (st.obra && !opts.obra ? '<div><span class="po-obra">' + (st.obra.cover ? '<img src="' + esc(st.obra.cover) + '" alt="">' : '') + '<span>' + esc(st.obra.title) + '</span><button class="k-btn k-btn--quiet k-btn--icon k-btn--sm" type="button" data-rm="obra" aria-label="Quitar obra" style="width:22px;height:22px;min-height:0"><i class="ti ti-x" aria-hidden="true"></i></button></span></div>' : '') +
        (st.spoiler ? '<span class="k-badge k-badge--warn" style="justify-self:start"><i class="ti ti-eye-off" aria-hidden="true"></i>Se mostrará como spoiler</span>' : '');
      form.querySelector('[data-tool="spoiler"]').setAttribute('aria-pressed', String(st.spoiler));
    }
    ta.addEventListener('input', refresh);
    ta.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') form.requestSubmit(); });
    extras.addEventListener('click', function (e) { var b = e.target.closest('[data-rm]'); if (!b) return; st[b.dataset.rm] = null; refresh(); });
    form.querySelector('[data-file]').addEventListener('change', function () {
      var f = this.files[0]; this.value = ''; if (!f) return;
      if (f.size > 8 * 1024 * 1024) return toast('La imagen pesa más de 8 MB.', 'bad');
      var fd = new FormData(); fd.append('image', f); if (f.type === 'image/gif') fd.append('isGif', '1');
      st.busy = true; refresh(); toast('Subiendo imagen…');
      api('/api/upload/image', { method: 'POST', body: fd }).then(function (d) { st.media = d.url; toast('Imagen lista', 'ok'); })
        .catch(function (er) { toast(er.status === 500 || er.status === 503 ? 'Las imágenes no están disponibles ahora mismo.' : er.message, 'bad'); })
        .then(function () { st.busy = false; refresh(); });
    });
    var tools = { gif: gifPanel, obra: obraPanel };
    form.querySelector('.cp-bar').addEventListener('click', function (e) {
      var b = e.target.closest('[data-tool]'); if (!b) return;
      if (b.dataset.tool === 'spoiler') { st.spoiler = !st.spoiler; return refresh(); }
      var open = b.getAttribute('aria-pressed') !== 'true';
      form.querySelectorAll('[data-tool="gif"],[data-tool="obra"]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      panel.hidden = !open; if (open) { b.setAttribute('aria-pressed', 'true'); tools[b.dataset.tool](); }
    });
    function closePanel() { panel.hidden = true; form.querySelectorAll('[data-tool]').forEach(function (x) { if (x.dataset.tool !== 'spoiler') x.setAttribute('aria-pressed', 'false'); }); }
    function searchPanel(ph, run) {
      panel.innerHTML = '<input class="k-input" type="search" placeholder="' + ph + '" aria-label="' + ph + '"><div data-res></div>';
      var inp = panel.querySelector('input'), res = panel.querySelector('[data-res]'), t;
      inp.addEventListener('input', function () { clearTimeout(t); t = setTimeout(function () { run(inp.value.trim(), res); }, 300); });
      inp.focus(); run('', res);
    }
    function gifPanel() {
      searchPanel('Buscar GIF…', function (q, res) {
        res.innerHTML = '<div class="k-skeleton" style="height:120px"></div>';
        api('/api/feed/gif-search?q=' + encodeURIComponent(q || 'anime') + '&limit=24').then(function (d) {
          var l = d.results || [];
          res.innerHTML = l.length ? '<div class="cp-gifs">' + l.map(function (g) { return '<button type="button" data-gif="' + esc(g.url) + '"><img src="' + esc(g.preview || g.url) + '" alt="" loading="lazy"></button>'; }).join('') + '</div>' : '<p class="k-muted" style="margin:0;font-size:var(--k-fs-sm)">No hay GIF para esa búsqueda.</p>';
        }).catch(function () { res.innerHTML = '<p class="k-error">La búsqueda de GIF no está disponible.</p>'; });
      });
      panel.onclick = function (e) { var b = e.target.closest('[data-gif]'); if (!b) return; st.media = b.dataset.gif; closePanel(); refresh(); };
    }
    function obraPanel() {
      searchPanel('Buscar obra…', function (q, res) {
        if (q.length < 2) { res.innerHTML = '<p class="k-muted" style="margin:0;font-size:var(--k-fs-sm)">Escribe al menos 2 letras.</p>'; return; }
        api('/api/manga/search?q=' + encodeURIComponent(q) + '&limit=8').then(function (d) {
          var l = d.results || d.mangas || [];
          res.innerHTML = l.length ? '<div class="cp-obras">' + l.map(function (m) { return '<button type="button" data-obra="' + esc(m.id) + '" data-t="' + esc(m.title) + '" data-c="' + esc(m.cover || '') + '">' + (m.cover ? '<img src="' + esc(m.cover) + '" alt="">' : '<span class="ph"></span>') + '<span>' + esc(m.title) + '</span></button>'; }).join('') + '</div>' : '<p class="k-muted" style="margin:0;font-size:var(--k-fs-sm)">Sin resultados.</p>';
        }).catch(function () { res.innerHTML = '<p class="k-error">No se pudo buscar.</p>'; });
      });
      panel.onclick = function (e) { var b = e.target.closest('[data-obra]'); if (!b) return; st.obra = { id: b.dataset.obra, title: b.dataset.t, cover: b.dataset.c }; closePanel(); refresh(); };
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault(); var text = ta.value.trim(); if (!text || text.length > MAX || st.busy) return;
      st.busy = true; refresh();
      var body = { content: text, is_spoiler: st.spoiler };
      if (st.media) body.media_url = st.media;
      if (st.obra) body.manga_id = st.obra.id;
      if (opts.parent) body.parent_id = +opts.parent;
      if (opts.community) body.community_id = opts.community;
      send('/api/feed/post', 'POST', body).then(function (d) {
        ta.value = ''; st.media = null; st.spoiler = false; if (!opts.obra) st.obra = null;
        toast(opts.parent ? 'Respuesta publicada' : 'Publicado', 'ok');
        if (opts.onDone) opts.onDone(d.post || d);
      }).catch(function (er) { toast(er.message, 'bad'); })
        .then(function () { st.busy = false; refresh(); });
    });
    refresh();
    return { focus: function () { ta.focus(); } };
  }
  function openComposer() {
    if (!logged) return goLogin();
    var r = parse(), opts = { id: 'cpd', onDone: function () { $('cp-dlg').close(); if (r.name === 'inicio' || r.name === 'comunidad') route(); } };
    if (r.name === 'comunidad' && CUR.community) { opts.community = CUR.community.id; opts.ctx = '<i class="ti ti-users-group" aria-hidden="true"></i>En ' + esc(CUR.community.name); }
    var c = composer($('cp-dlg-body'), opts); $('cp-dlg').showModal(); c.focus();
  }
  document.querySelectorAll('[data-compose]').forEach(function (b) { b.addEventListener('click', openComposer); });
  document.querySelectorAll('dialog [data-close]').forEach(function (b) { b.addEventListener('click', function () { b.closest('dialog').close(); }); });
  $('cp-dlg').addEventListener('click', function (e) { if (e.target === $('cp-dlg')) $('cp-dlg').close(); });

  /* ═══ Router ══════════════════════════════════════════════════ */
  var CUR = {};
  function parse() {
    var h = decodeURIComponent(location.hash.slice(1) || 'inicio'), q = '';
    var qi = h.indexOf('?'); if (qi >= 0) { q = new URLSearchParams(h.slice(qi + 1)).get('q') || ''; h = h.slice(0, qi); }
    var parts = h.split('/');
    var alias = { marcadores: 'guardados', explore: 'explorar', 'comunidad': 'comunidad' };
    return { name: alias[parts[0]] || parts[0], arg: parts.slice(1).join('/'), q: q };
  }
  var VIEWS = { inicio: viewHome, post: viewPost, explorar: viewExplore, comunidades: viewCommunities, comunidad: viewCommunity, notificaciones: viewNotifs, mensajes: viewDMs, guardados: viewSaved };
  function route() {
    var r = parse(); if (!VIEWS[r.name]) { r = { name: 'inicio' }; }
    var navKey = { post: 'inicio', comunidad: 'comunidades' }[r.name] || r.name;
    document.querySelectorAll('#cm-nav a').forEach(function (a) { if (a.dataset.r === navKey) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (CUR.cleanup) { try { CUR.cleanup(); } catch (e) {} }
    CUR = {};
    $('cm-head').innerHTML = ''; $('cm-view').innerHTML = '';
    VIEWS[r.name](r);
    if (r.name !== 'mensajes') scrollTo({ top: 0 });
    var a = document.querySelector('#cm-nav a[aria-current]'); if (a && innerWidth <= 860) a.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  window.addEventListener('hashchange', route);

      var l = d.notifications || [];
      $('nt-read').hidden = !l.some(function (n) { return !n.read; });
      $('cm-view').innerHTML = l.length ? '<div class="cm-list" style="gap:var(--k-1)">' + l.map(function (n) {
        var t = NT[n.type] || ['bell', 'var(--k-text-2)', 'tiene novedades para ti'], who = (n.actor && n.actor.username) || 'Alguien';
        var href = n.post_id ? '#post/' + n.post_id : '/perfil/' + encodeURIComponent(who);
        return '<a class="nt' + (n.read ? '' : ' is-new') + '" href="' + href + '"><span class="ico" style="color:' + t[1] + '"><i class="ti ti-' + t[0] + '" aria-hidden="true"></i></span><div style="min-width:0"><div class="k-row" style="gap:var(--k-2);margin-bottom:4px">' + ava(who, n.actor && n.actor.avatar, 'k-avatar--sm') + '<time>' + ago(n.created_at) + '</time></div><p><b>' + esc(who) + '</b> ' + t[2] + '</p>' + (n.post_preview || n.post_content ? '<p class="k-muted" style="font-size:var(--k-fs-xs);margin-top:4px">' + esc(String(n.post_preview || n.post_content).slice(0, 120)) + '</p>' : '') + '</div></a>';
      }).join('') + '</div>' : emptyBox('bell-off', 'Sin avisos', 'Cuando alguien te siga, responda o comparta lo que publicas, lo verás aquí.');
      if (d.unread_count) setTimeout(markRead, 1500);
    }).catch(function () { $('cm-view').innerHTML = '<p class="k-error">No se pudieron cargar los avisos.</p>'; });
    $('nt-read').addEventListener('click', markRead);
    function markRead() { send('/api/feed/notifications/read', 'POST', {}).then(function () { document.querySelectorAll('.nt.is-new').forEach(function (x) { x.classList.remove('is-new'); }); $('nt-read').hidden = true; badges(); }).catch(function () {}); }
  }

  /* ═══ Mensajes ════════════════════════════════════════════════ */
  function viewDMs(r) {
    head('Mensajes');
    if (!logged) { $('cm-view').innerHTML = emptyBox('message', 'Inicia sesión', 'Para enviar y recibir mensajes privados.', '<a class="k-btn k-btn--primary" href="/acceder?next=/comunidad%23mensajes">Iniciar sesión</a>'); return; }
    var conv = parseInt(r.arg, 10) || null;
    $('cm-view').innerHTML = '<div class="dm' + (conv ? ' has-chat' : '') + '" id="dm"><div class="dm-list" id="dm-list" aria-label="Conversaciones"></div><section class="dm-chat" id="dm-chat"></section></div>';
    function loadList() {
      return api('/api/dms').then(function (d) {
        var l = d.conversations || [];
        $('dm-list').innerHTML = l.length ? l.map(function (c) {
          return '<a class="dm-item" href="#mensajes/' + c.id + '"' + (c.id === conv ? ' aria-current="true"' : '') + '>' + ava(c.other_username, c.other_avatar) + '<span style="min-width:0"><b>' + esc(c.other_username || 'Conversación') + '</b><small>' + esc(c.last_message || 'Sin mensajes') + '</small></span><span style="display:grid;gap:4px;justify-items:end"><small class="k-faint" style="font-size:11px">' + (c.last_message_at ? ago(c.last_message_at) : '') + '</small>' + (c.has_unread && c.id !== conv ? '<span class="dot" aria-label="Sin leer"></span>' : '') + '</span></a>';
        }).join('') : '<div class="dm-empty"><div><i class="ti ti-messages" aria-hidden="true" style="font-size:34px"></i><p>No tienes conversaciones.<br>Escribe a alguien desde su perfil con «Mensaje».</p></div></div>';
        return l;
      }).catch(function () { $('dm-list').innerHTML = '<p class="k-error" style="padding:var(--k-4)">No se pudieron cargar.</p>'; return []; });
    }
    function openChat(list) {
      var box = $('dm-chat');
      if (!conv) { box.innerHTML = '<div class="dm-empty" style="grid-row:1/-1"><div><i class="ti ti-message-circle" aria-hidden="true" style="font-size:40px"></i><p>Elige una conversación</p></div></div>'; return; }
      box.innerHTML = '<div class="dm-chat-head"><a class="k-btn k-btn--quiet k-btn--icon k-btn--sm" href="#mensajes" aria-label="Volver a las conversaciones"><i class="ti ti-arrow-left" aria-hidden="true"></i></a><span id="dm-who"></span></div><div class="dm-msgs" id="dm-msgs" aria-live="polite"></div><form class="dm-send" id="dm-form"><label class="k-visually-hidden" for="dm-t">Mensaje</label><textarea class="k-input" id="dm-t" rows="1" maxlength="2000" placeholder="Escribe un mensaje…"></textarea><button class="k-btn k-btn--primary" type="submit" aria-label="Enviar"><i class="ti ti-send" aria-hidden="true"></i></button></form>';
      var other = null, lastDay = '';
      function paint(msgs) {
        lastDay = '';
        $('dm-msgs').innerHTML = msgs.length ? msgs.map(function (m) {
          var day = new Date(m.created_at).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }), sep = day !== lastDay ? '<div class="msg-day">' + esc(day) + '</div>' : ''; lastDay = day;
          return sep + msgHTML({ message: m.message, created_at: m.created_at }, other ? m.sender_id !== other.id : (me && m.username === me.username));
        }).join('') : '<p class="k-muted" style="text-align:center;margin:auto;font-size:var(--k-fs-sm)">Todavía no os habéis escrito. ¡Saluda!</p>';
        $('dm-msgs').scrollTop = $('dm-msgs').scrollHeight;
      }
      function load() {
        return api('/api/dms/' + conv).then(function (d) {
          other = d.other; $('dm-who').innerHTML = other ? '<a href="/perfil/' + encodeURIComponent(other.username) + '" style="display:inline-flex;align-items:center;gap:8px">' + ava(other.username, other.avatar, 'k-avatar--sm') + esc(other.username) + '</a>' : '';
          paint(d.messages || []);
          send('/api/dms/' + conv + '/read', 'POST').then(badges).catch(function () {});
        }).catch(function () { $('dm-msgs').innerHTML = '<p class="k-error">No se pudo abrir la conversación.</p>'; });
      }
      load();
      var t = $('dm-t');
      t.addEventListener('input', function () { t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; });
      t.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('dm-form').requestSubmit(); } });
      $('dm-form').addEventListener('submit', function (e) {
        e.preventDefault(); var v = t.value.trim(); if (!v) return; t.value = ''; t.style.height = 'auto';
        send('/api/dms/' + conv, 'POST', { message: v }).then(function () { load(); loadList(); }).catch(function (er) { t.value = v; toast(er.message, 'bad'); });
      });
      t.focus();
      var h = function (ev) { if (ev && +ev.conversation_id === conv) load(); loadList(); };
      if (sock) sock.on('new-dm', h);
      var poll = setInterval(function () { if (!sock || !sock.connected) load(); }, 10000);
      CUR.cleanup = function () { if (sock) sock.off('new-dm', h); clearInterval(poll); };
    }
    // Venimos de un perfil con «Mensaje»: se abre (o crea) la conversación
    var pending = null; try { pending = JSON.parse(sessionStorage.getItem('kami_dm_recipient') || 'null'); sessionStorage.removeItem('kami_dm_recipient'); } catch (e) {}
    if (pending && pending.id) {
      send('/api/dms', 'POST', { recipient_id: pending.id }).then(function (d) { location.hash = 'mensajes/' + d.conversation_id; }).catch(function (er) { toast(er.message, 'bad'); loadList().then(openChat); });
      return;
    }
    loadList().then(openChat);
  }

  /* ═══ Guardados ═══════════════════════════════════════════════ */
  function viewSaved() {
    head('Guardados');
    if (!logged) { $('cm-view').innerHTML = emptyBox('bookmark', 'Inicia sesión', 'Guarda publicaciones para leerlas más tarde.', '<a class="k-btn k-btn--primary" href="/acceder?next=/comunidad%23guardados">Iniciar sesión</a>'); return; }
    feed($('cm-view'), '/api/feed/bookmarks', { keepReplies: true, empty: emptyBox('bookmark', 'Nada guardado', 'Pulsa el marcador de cualquier publicación para guardarla aquí.') });
  }

  /* ═══ Lateral y contadores ════════════════════════════════════ */
  function loadSide() {
    if (innerWidth <= 1180) return;
    api('/api/communities/trending').then(function (d) {
      var tp = (d.trending_posts || []).slice(0, 4), news = (d.latest_news || []).filter(function (n) { return n.is_global_announcement || n.is_news; }).slice(0, 2);
      $('sd-trend').hidden = !tp.length;
      $('sd-trend-l').innerHTML = tp.map(function (p) { return '<a class="cm-trend" href="#post/' + p.id + '"><small>' + esc(p.manga_title || ('@' + (p.username || '').toLowerCase())) + ' · ' + compact.format((p.like_count || 0) + (p.reply_count || 0) + (p.repost_count || 0)) + ' interacciones</small><b>' + esc(String(p.content || '').slice(0, 110)) + '</b></a>'; }).join('');
      $('sd-news').hidden = !news.length;
      $('sd-news-l').innerHTML = news.map(function (p) { return '<a class="cm-trend" href="#post/' + p.id + '"><small>' + esc(p.username || 'KamiTales') + ' · ' + ago(p.created_at) + '</small><b>' + esc(String(p.content || '').slice(0, 110)) + '</b></a>'; }).join('');
    }).catch(function () {});
    if (!logged) return;
    api('/api/communities/sidebar-data').then(function (d) {
      var j = d.joined || [], s = d.suggested || [];
      var row = function (c) { var av = c.avatar_url || c.manga_cover; return '<a class="cm-row" style="padding:var(--k-2);margin:0 calc(var(--k-2) * -1)" href="#comunidad/' + encodeURIComponent(c.id) + '"><span class="cc-ava" style="width:36px;height:36px;border-radius:10px;border:0;' + (av ? 'background-image:url(\'' + esc(av) + '\')' : '') + '">' + (av ? '' : esc((c.name || '?').slice(0, 1))) + '</span><span style="min-width:0"><b>' + esc((c.name || '').trim()) + '</b><small>' + nf.format(+c.member_count || 0) + ' miembros</small></span><span></span></a>'; };
      $('sd-mine').hidden = !j.length; $('sd-mine-l').innerHTML = j.slice(0, 5).map(row).join('');
      $('sd-sugg').hidden = !s.length; $('sd-sugg-l').innerHTML = s.slice(0, 4).map(row).join('');
    }).catch(function () {});
  }
  function badges() {
    if (!logged) return;
    api('/api/feed/notifications').then(function (d) { var n = d.unread_count || 0; $('b-notif').hidden = !n; $('b-notif').textContent = n > 99 ? '99+' : n; }).catch(function () {});
    api('/api/dms/unread/count').then(function (d) { var n = d.unread_count || 0; $('b-dm').hidden = !n; $('b-dm').textContent = n > 99 ? '99+' : n; }).catch(function () {});
  }

  /* ═══ Arranque ════════════════════════════════════════════════ */
  function connect() {
    if (!window.io || !logged) return;
    try {
      sock = window.io({ reconnection: true, reconnectionDelay: 2000, auth: { token: token } });
      sock.on('connect', function () { sock.emit('join-dm', { token: token }); });
      sock.on('new-dm', function () { badges(); });
    } catch (e) { sock = null; }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  function start() {
    connect();
    route(); loadSide(); badges();
    setInterval(badges, 60000);
  }
})();
</script>
</body>
</html>
