# Los valores se configuran en el panel de Render (Environment). Nunca escribas secretos aquí:
# el repositorio es público. Copia local de la versión anterior: E:KAMI_backupsender.yaml.con-secretos
services:
  - type: web
    name: kami-manga
    runtime: node
    buildCommand: cd backend && rm -rf node_modules package-lock.json && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
