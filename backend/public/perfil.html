<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Perfil · KamiTales</title>
  <meta name="description" content="Perfil de lector y autor en KamiTales: obras, actividad, biblioteca, estadísticas y logros.">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/kami.css">
  <script src="/js/kami-shell.js"></script>
  <style>
    [hidden] { display: none !important; }

    /* ── Portada ───────────────────────────────────────────── */
    .pf-banner { position: relative; height: clamp(170px, 26vw, 300px); overflow: hidden; background:
        radial-gradient(70% 120% at 15% 0%, color-mix(in srgb, var(--k-accent) 45%, transparent), transparent 60%),
        radial-gradient(60% 120% at 90% 30%, color-mix(in srgb, var(--k-gold) 22%, transparent), transparent 60%), var(--k-surface-2); }
    .pf-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pf-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, var(--k-bg) 100%); }

    .pf-wrap { padding-top: 0; }
    .pf-head { position: relative; margin-top: calc(var(--k-12) * -1.4); display: grid; grid-template-columns: auto 1fr auto; gap: var(--k-5) var(--k-6); align-items: end; }
    .pf-ava { --_s: 132px; position: relative; width: var(--_s); height: var(--_s); border-radius: 50%; padding: 4px; background: conic-gradient(from 210deg, var(--k-accent), var(--k-gold), var(--k-accent)); box-shadow: 0 0 40px -6px var(--k-accent); }
    .pf-ava > span { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--k-surface-2); border: 4px solid var(--k-bg); font: 800 46px/1 var(--k-font-display); color: var(--k-text); }
    .pf-ava img { width: 100%; height: 100%; object-fit: cover; }
    .pf-ava .pf-emoji { position: absolute; right: 2px; bottom: 6px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-style: normal; background: var(--k-surface-1); border: 3px solid var(--k-bg); }
    .pf-id { min-width: 0; display: grid; gap: var(--k-2); padding-bottom: var(--k-2); }
    .pf-name { margin: 0; font: 900 clamp(2.1rem, 5vw, 3.4rem)/.95 var(--k-font-display); text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; }
    .pf-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .pf-badges:empty { display: none; }
    .pf-handle { color: var(--k-text-3); font-size: var(--k-fs-sm); }
    .pf-actions { display: flex; flex-wrap: wrap; gap: var(--k-2); justify-content: flex-end; padding-bottom: var(--k-2); position: relative; }
    .pf-actions .k-menu { right: 0; top: calc(100% + 6px); }

    .pf-about { margin-top: var(--k-5); display: grid; gap: var(--k-3); max-width: 70ch; }
    .pf-bio { margin: 0; color: var(--k-text-2); font-size: var(--k-fs-md); line-height: 1.65; white-space: pre-line; overflow-wrap: anywhere; }
    .pf-meta { display: flex; flex-wrap: wrap; gap: var(--k-2) var(--k-4); color: var(--k-text-3); font-size: var(--k-fs-sm); }
    .pf-meta span { display: inline-flex; align-items: center; gap: 6px; }

    .pf-stats { margin-top: var(--k-6); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--k-line); border-radius: var(--k-r-lg); background: var(--k-surface-1); overflow: hidden; }
    .pf-stat { display: grid; gap: 4px; padding: var(--k-4) var(--k-5); text-align: left; background: none; border: 0; border-right: 1px solid var(--k-line); color: inherit; font: inherit; min-width: 0; }
    .pf-stat:last-child { border-right: 0; }
    button.pf-stat { cursor: pointer; transition: background var(--k-t-fast); }
    button.pf-stat:hover { background: rgb(var(--k-ink) / .04); }
    .pf-stat b { font: 800 var(--k-fs-2xl)/1 var(--k-font-display); letter-spacing: .02em; }
    .pf-stat span { font-size: var(--k-fs-xs); color: var(--k-text-3); text-transform: uppercase; letter-spacing: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pf-stat--fire b { color: var(--k-warn); }

    /* ── Cuerpo ────────────────────────────────────────────── */
    .pf-body { margin-top: var(--k-8); display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--k-8); align-items: start; }
    .pf-tabs { position: sticky; top: var(--k-nav-h); z-index: 5; background: color-mix(in srgb, var(--k-bg) 88%, transparent); backdrop-filter: blur(10px); }
    .pf-tab .k-num { margin-left: 6px; font-size: 11px; color: var(--k-text-3); }
    .pf-panel { padding-top: var(--k-6); }
    .pf-panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--k-3); margin-bottom: var(--k-5); }
    .pf-panel-head > .k-chips { min-width: 0; flex: 1; }
    .pf-aside { display: grid; gap: var(--k-4); position: sticky; top: calc(var(--k-nav-h) + var(--k-4)); }
    .pf-aside h3 { margin: 0 0 var(--k-3); font: 700 var(--k-fs-xs)/1 var(--k-font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--k-text-3); }

    .pf-level { display: grid; gap: var(--k-3); }
    .pf-level-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--k-3); }
    .pf-level-top b { font: 900 var(--k-fs-3xl)/1 var(--k-font-display); color: var(--k-accent); text-shadow: var(--k-glow-text); }
    .pf-bar { height: 8px; border-radius: 99px; background: rgb(var(--k-ink) / .08); overflow: hidden; }
    .pf-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--k-accent), var(--k-gold)); box-shadow: 0 0 12px var(--k-accent); }

    .pf-genre { display: grid; grid-template-columns: 1fr auto; gap: 6px var(--k-3); align-items: center; font-size: var(--k-fs-sm); }
    .pf-genre + .pf-genre { margin-top: var(--k-3); }
    .pf-genre .pf-bar { grid-column: 1 / -1; height: 6px; }
    .pf-mini { display: grid; grid-template-columns: 44px 1fr; gap: var(--k-3); align-items: center; text-decoration: none; color: inherit; padding: 6px; margin: 0 -6px; border-radius: var(--k-r-sm); }
    .pf-mini:hover { background: rgb(var(--k-ink) / .05); }
    .pf-mini img, .pf-mini .ph { width: 44px; height: 62px; border-radius: 8px; object-fit: cover; background: var(--k-surface-2); }
    .pf-mini b { display: block; font-size: var(--k-fs-sm); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pf-mini small { color: var(--k-text-3); font-size: var(--k-fs-xs); }

    /* Obras y biblioteca */
    .pf-progress { height: 4px; border-radius: 4px; background: rgb(var(--k-ink) / .1); overflow: hidden; }
    .pf-progress i { display: block; height: 100%; background: var(--k-accent); }
    .pf-fav { position: absolute; right: 8px; bottom: 8px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgb(0 0 0 / .6); color: var(--k-accent); font-size: 15px; }

    /* Actividad */
    .pf-posts { display: grid; gap: var(--k-3); }
    .pf-post { display: grid; gap: var(--k-3); padding: var(--k-5); text-decoration: none; color: inherit; }
    .pf-post-top { display: flex; align-items: center; gap: var(--k-3); font-size: var(--k-fs-sm); min-width: 0; flex-wrap: wrap; }
    .pf-post-top b { font-weight: 700; }
    .pf-post-top time { color: var(--k-text-3); margin-left: auto; font-size: var(--k-fs-xs); white-space: nowrap; }
    .pf-post p { margin: 0; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; color: var(--k-text); }
    .pf-post img { max-width: 100%; max-height: 360px; border-radius: var(--k-r-md); object-fit: cover; }
    .pf-post-foot { display: flex; gap: var(--k-5); color: var(--k-text-3); font-size: var(--k-fs-xs); }
    .pf-post-foot span { display: inline-flex; align-items: center; gap: 5px; }
    .pf-spoiler p { filter: blur(6px); transition: filter .2s; }
    .pf-spoiler.is-shown p { filter: none; }
    .pf-repost { font-size: var(--k-fs-xs); color: var(--k-text-3); display: flex; align-items: center; gap: 6px; }

    /* Estadísticas */
    .pf-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--k-3); }
    .pf-kpi { padding: var(--k-4) var(--k-5); }
    .pf-kpi b { display: block; font: 800 var(--k-fs-2xl)/1 var(--k-font-display); }
    .pf-kpi span { font-size: var(--k-fs-xs); color: var(--k-text-3); text-transform: uppercase; letter-spacing: .1em; }
    .pf-heat-wrap { overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
    .pf-heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; width: max-content; }
    .pf-heat i { width: 12px; height: 12px; border-radius: 3px; background: rgb(var(--k-ink) / .06); }
    .pf-heat i[data-l="1"] { background: color-mix(in srgb, var(--k-accent) 30%, transparent); }
    .pf-heat i[data-l="2"] { background: color-mix(in srgb, var(--k-accent) 55%, transparent); }
    .pf-heat i[data-l="3"] { background: color-mix(in srgb, var(--k-accent) 80%, transparent); }
    .pf-heat i[data-l="4"] { background: var(--k-accent); box-shadow: 0 0 8px var(--k-accent); }
    .pf-legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: var(--k-fs-xs); color: var(--k-text-3); margin-top: var(--k-3); }
    .pf-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .pf-two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--k-4); }

    /* Logros */
    .pf-achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: var(--k-3); }
    .pf-ach { display: grid; grid-template-columns: 46px 1fr; gap: var(--k-3); align-items: center; padding: var(--k-4); }
    .pf-ach .ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgb(var(--k-ink) / .06); filter: grayscale(1); opacity: .6; }
    .pf-ach.is-on { border-color: color-mix(in srgb, var(--k-gold) 45%, transparent); }
    .pf-ach.is-on .ico { filter: none; opacity: 1; background: color-mix(in srgb, var(--k-gold) 18%, transparent); box-shadow: 0 0 18px -4px var(--k-gold); }
    .pf-ach b { font-size: var(--k-fs-sm); display: block; }
    .pf-ach small { color: var(--k-text-3); font-size: var(--k-fs-xs); display: block; margin: 2px 0 6px; }
    .pf-ach .pf-progress i { background: var(--k-gold); }

    /* Lista de seguidores */
    .pf-people { display: grid; gap: 2px; max-height: 60dvh; overflow-y: auto; }
    .pf-person { display: flex; align-items: center; gap: var(--k-3); padding: var(--k-2); border-radius: var(--k-r-sm); text-decoration: none; color: inherit; }
    .pf-person:hover { background: rgb(var(--k-ink) / .05); }

    .pf-skel-head { display: grid; grid-template-columns: 132px 1fr; gap: var(--k-6); align-items: end; margin-top: -70px; position: relative; }

    @media (max-width: 1023px) {
      .pf-body { grid-template-columns: minmax(0, 1fr); }
      .pf-aside { position: static; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); order: -1; }
      .pf-aside [data-side="reading"] { display: none; }
    }
    @media (max-width: 767px) {
      .pf-head { grid-template-columns: 1fr; justify-items: start; margin-top: -64px; gap: var(--k-4); }
      .pf-ava { --_s: 104px; }
      .pf-ava > span { font-size: 36px; }
      .pf-actions { justify-content: flex-start; width: 100%; }
      .pf-actions > .k-btn:first-child { flex: 1; }
      .pf-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .pf-stat { padding: var(--k-3) var(--k-4); border-bottom: 1px solid var(--k-line); }
      .pf-stat:nth-child(3n) { border-right: 0; }
      .pf-stat b { font-size: var(--k-fs-xl); }
      .pf-stat span { white-space: normal; letter-spacing: .04em; font-size: 10.5px; line-height: 1.25; }
      .pf-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .pf-two { grid-template-columns: 1fr; }
      .pf-aside { grid-template-columns: 1fr; }
      .pf-skel-head { grid-template-columns: 1fr; margin-top: -50px; }
    }
  </style>
</head>
<body>
<div class="pf-banner" id="pf-banner" aria-hidden="true"></div>

<main class="k-page pf-wrap" id="k-main">
  <!-- Cargando -->
  <div id="pf-loading" class="pf-skel-head" aria-busy="true" aria-label="Cargando perfil">
    <div class="k-skeleton" style="width:132px;height:132px;border-radius:50%"></div>
    <div class="k-stack"><div class="k-skeleton" style="height:44px;width:min(320px,80%)"></div><div class="k-skeleton" style="height:16px;width:min(460px,90%)"></div></div>
  </div>

  <!-- No encontrado -->
  <div id="pf-missing" class="k-empty" hidden>
    <i class="ti ti-user-question" aria-hidden="true"></i>
    <h3>Este perfil no existe</h3>
    <p id="pf-missing-t">Puede que el nombre de usuario haya cambiado o que la cuenta se haya eliminado.</p>
    <a class="k-btn k-btn--primary" href="/">Ir a Explorar</a>
  </div>

  <div id="pf" hidden>
    <header class="pf-head">
      <div class="pf-ava"><span id="pf-ava"></span><i class="pf-emoji" id="pf-emoji" hidden></i></div>
      <div class="pf-id">
        <div class="pf-badges" id="pf-badges"></div>
        <h1 class="pf-name" id="pf-name"></h1>
        <span class="pf-handle" id="pf-handle"></span>
      </div>
      <div class="pf-actions" id="pf-actions"></div>
    </header>

    <section class="pf-about" aria-label="Sobre este perfil">
      <p class="pf-bio" id="pf-bio"></p>
      <div class="pf-meta" id="pf-meta"></div>
    </section>

    <div class="pf-stats" id="pf-stats" role="list"></div>

    <div class="pf-body">
      <div>
        <div class="k-tabs pf-tabs" role="tablist" aria-label="Secciones del perfil" id="pf-tabs"></div>

        <section class="pf-panel" role="tabpanel" id="panel-obras" aria-labelledby="tab-obras" hidden>
          <div class="pf-panel-head"><p class="k-muted" id="obras-sub" style="margin:0"></p><a class="k-btn k-btn--secondary k-btn--sm" id="obras-studio" href="/estudio" hidden><i class="ti ti-layout-dashboard" aria-hidden="true"></i>Abrir el Estudio</a></div>
          <div class="k-grid k-grid--covers" id="obras-grid"></div>
        </section>

        <section class="pf-panel" role="tabpanel" id="panel-actividad" aria-labelledby="tab-actividad" hidden>
          <div class="pf-posts" id="posts"></div>
        </section>

        <section class="pf-panel" role="tabpanel" id="panel-biblioteca" aria-labelledby="tab-biblioteca" hidden>
          <div class="pf-panel-head">
            <div class="k-chips k-chips--scroll" id="lib-filters" role="group" aria-label="Filtrar biblioteca"></div>
            <a class="k-btn k-btn--quiet k-btn--sm" href="/biblioteca" id="lib-manage" hidden><i class="ti ti-adjustments" aria-hidden="true"></i>Gestionar</a>
          </div>
          <div class="k-grid k-grid--covers" id="lib-grid"></div>
        </section>

        <section class="pf-panel" role="tabpanel" id="panel-estadisticas" aria-labelledby="tab-estadisticas" hidden>
          <div class="k-stack" style="gap:var(--k-4)">
            <div class="pf-kpis" id="kpis"></div>
            <div class="k-card">
              <div class="pf-panel-head" style="margin-bottom:var(--k-4)"><h3 class="k-h3" style="margin:0">Días de lectura</h3><span class="k-faint" id="heat-sub" style="font-size:var(--k-fs-xs)"></span></div>
              <div class="pf-heat-wrap"><div class="pf-heat" id="heat" role="img"></div></div>
              <div class="pf-legend">Menos <i style="background:rgb(var(--k-ink)/.06)"></i><i style="background:color-mix(in srgb,var(--k-accent) 30%,transparent)"></i><i style="background:color-mix(in srgb,var(--k-accent) 55%,transparent)"></i><i style="background:color-mix(in srgb,var(--k-accent) 80%,transparent)"></i><i style="background:var(--k-accent)"></i> Más</div>
            </div>
            <div class="pf-two">
              <div class="k-card"><h3 class="k-h3" style="margin:0 0 var(--k-4)">Ritmo</h3><div class="k-stack" id="rhythm" style="gap:var(--k-3)"></div></div>
              <div class="k-card"><h3 class="k-h3" style="margin:0 0 var(--k-4)">Lo más leído</h3><div id="top-read"></div></div>
            </div>
          </div>
        </section>

        <section class="pf-panel" role="tabpanel" id="panel-logros" aria-labelledby="tab-logros" hidden>
          <div class="pf-panel-head"><p class="k-muted" id="ach-sub" style="margin:0"></p></div>
          <div class="pf-achs" id="achs"></div>
        </section>
      </div>

      <aside class="pf-aside" aria-label="Resumen">
        <div class="k-card pf-level" id="side-level" hidden>
          <h3 style="margin:0">Nivel de lector</h3>
          <div class="pf-level-top"><b id="lvl-n">1</b><span class="k-faint" id="lvl-xp" style="font-size:var(--k-fs-sm)"></span></div>
          <div class="pf-bar" role="progressbar" aria-label="Progreso al siguiente nivel" aria-valuemin="0" aria-valuemax="100" id="lvl-bar-w"><i id="lvl-bar" style="width:0"></i></div>
          <span class="k-faint" id="lvl-next" style="font-size:var(--k-fs-xs)"></span>
        </div>
        <div class="k-card" id="side-genres" hidden><h3>Géneros favoritos</h3><div id="genres"></div></div>
        <div class="k-card" data-side="reading" id="side-reading" hidden><h3>Leyendo ahora</h3><div id="reading"></div></div>
      </aside>
    </div>
  </div>
</main>

<!-- Seguidores / siguiendo -->
<dialog class="k-modal" id="people-dlg" aria-labelledby="people-t">
  <div class="k-modal__head"><h2 class="k-h3" id="people-t" style="margin:0">Seguidores</h2><button class="k-btn k-btn--quiet k-btn--icon" type="button" data-close aria-label="Cerrar"><i class="ti ti-x" aria-hidden="true"></i></button></div>
  <div class="k-modal__body"><div class="pf-people" id="people"></div></div>
</dialog>

<!-- Moderación -->
<dialog class="k-modal" id="mod-dlg" aria-labelledby="mod-t">
  <form id="mod-form">
    <div class="k-modal__head"><h2 class="k-h3" id="mod-t" style="margin:0">Moderar</h2><button class="k-btn k-btn--quiet k-btn--icon" type="button" data-close aria-label="Cerrar"><i class="ti ti-x" aria-hidden="true"></i></button></div>
    <div class="k-modal__body">
      <p class="k-muted" id="mod-info" style="margin:0"></p>
      <div class="k-field" id="mod-dur-f">
        <label class="k-label" for="mod-dur">Duración</label>
        <select class="k-input" id="mod-dur">
          <option value="3600">1 hora</option><option value="86400" selected>24 horas</option><option value="604800">7 días</option><option value="2592000">30 días</option><option value="0">Permanente</option>
        </select>
      </div>
      <div class="k-field">
        <label class="k-label" for="mod-reason" id="mod-reason-l">Motivo</label>
        <textarea class="k-input" id="mod-reason" rows="3" maxlength="500" placeholder="Se guarda en el historial de moderación…"></textarea>
      </div>
      <span class="k-error" id="mod-err" role="alert"></span>
    </div>
    <div class="k-modal__foot"><button class="k-btn k-btn--quiet" type="button" data-close>Cancelar</button><button class="k-btn k-btn--danger" type="submit" id="mod-go">Aplicar</button></div>
  </form>
</dialog>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var nf = new Intl.NumberFormat('es-ES');
  var compact = new Intl.NumberFormat('es-ES', { notation: 'compact', maximumFractionDigits: 1 });
  var me = (function () { try { return JSON.parse(localStorage.getItem('kami_user') || 'null'); } catch (e) { return null; } })();
  var logged = (function () { try { return !!localStorage.getItem('kami_token'); } catch (e) { return false; } })();
  var toast = function (m, t) { if (window.KAMI && KAMI.toast) KAMI.toast(m, t); };

  var parts = location.pathname.split('/').filter(Boolean);
  var username = parts[1] ? decodeURIComponent(parts[1]) : (me && me.username);
  if (!username) { location.replace('/acceder?next=' + encodeURIComponent('/perfil')); return; }

  var S = { profile: null, works: [], library: [], stats: null, xp: null, libFilter: 'all' };
  var TYPE = { manga: 'Manga', manhwa: 'Manhwa', manhua: 'Manhua', novel: 'Novela', comic: 'Cómic', webtoon: 'Webtoon' };
  var STATUS = { reading: 'Leyendo', continuing: 'Al día', planned: 'Pendiente', completed: 'Terminado', dropped: 'Abandonado', rereading: 'Releyendo' };

  function api(url, opt) {
    return fetch(url, opt).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || 'Error ' + r.status); e.status = r.status; throw e; } return d; }); });
  }
  function postJSON(url, body, method) { return api(url, { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }); }
  function isImg(v) { return typeof v === 'string' && /^(data:image\/|https?:\/\/|\/)/.test(v); }
  // Repara textos guardados con doble codificación (UTF-8 leído como CP437): «Espa├▒a» → «España»
  var CP437 = { '├í': 'á', '├®': 'é', '├¡': 'í', '├│': 'ó', '├║': 'ú', '├▒': 'ñ', '├╝': 'ü', '├ü': 'Á', '├ë': 'É', '├ì': 'Í', '├ô': 'Ó', '├Ü': 'Ú', '├æ': 'Ñ', '┬┐': '¿', '┬í': '¡' };

        (u.isBanned ? '<button class="k-menu__item" role="menuitem" type="button" data-mod="unban"><i class="ti ti-lock-open" aria-hidden="true"></i>Levantar suspensión</button>'

  }
  function onMenu(e) {

  // ── Cifras ───────────────────────────────────────────────
  function renderStats() {
    var p = S.profile, st = (S.stats && S.stats.stats) || {};
    var items = [];

          '<div class="pf-post-foot"><span><i class="ti ti-heart" aria-hidden="true"></i>' + compact.format(p.likes || 0) + '</span><span><i class="ti ti-message-circle" aria-hidden="true"></i>' + compact.format(p.replies || 0) + '</span><span><i class="ti ti-repeat" aria-hidden="true"></i>' + compact.format(p.reposts || 0) + '</span>' + (p.views_count ? '<span><i class="ti ti-eye" aria-hidden="true"></i>' + compact.format(p.views_count) + '</span>' : '') + '</div></a>';
      }).join('');
    }).catch(function () { box.innerHTML = empty('cloud-off', 'No se pudo cargar', 'Vuelve a intentarlo en un momento.'); });
  }
  $('posts').addEventListener('click', function (e) {
    var sp = e.target.closest('.pf-spoiler'); if (sp && !sp.classList.contains('is-shown')) { e.preventDefault(); sp.classList.add('is-shown'); }
  });

  // Biblioteca
  function renderLibrary() {
    $('lib-manage').hidden = !S.profile.canEdit;
    var counts = { all: S.library.length, fav: S.library.filter(function (m) { return m.isFavorite; }).length };
    S.library.forEach(function (m) { counts[m.status] = (counts[m.status] || 0) + 1; });
    var filters = [['all', 'Todo'], ['reading', 'Leyendo'], ['continuing', 'Al día'], ['planned', 'Pendientes'], ['completed', 'Terminados'], ['rereading', 'Releyendo'], ['dropped', 'Abandonados'], ['fav', 'Favoritos']]
      .filter(function (f) { return f[0] === 'all' || counts[f[0]]; });
    $('lib-filters').innerHTML = filters.map(function (f) { return '<button class="k-chip" type="button" data-f="' + f[0] + '" aria-pressed="' + (S.libFilter === f[0]) + '">' + f[1] + ' <span class="k-num" style="opacity:.7">' + counts[f[0]] + '</span></button>'; }).join('');
    var list = S.library.filter(function (m) { return S.libFilter === 'all' || (S.libFilter === 'fav' ? m.isFavorite : m.status === S.libFilter); });
    if (!list.length) {
      $('lib-grid').innerHTML = empty('books', 'Biblioteca vacía', S.profile.canEdit ? 'Añade obras desde su ficha y aparecerán aquí.' : 'Todavía no hay obras en su biblioteca.', S.profile.canEdit ? '<a class="k-btn k-btn--primary" href="/">Explorar obras</a>' : '');
      return;
    }
    $('lib-grid').innerHTML = list.map(function (m) {
      var pct = m.totalChapters ? Math.min(100, Math.round((m.progress || 0) / m.totalChapters * 100)) : 0;
      return cover({ id: m.mangaId, title: m.title, cover: m.cover, type: m.type }, {
        fav: m.isFavorite,
        badge: STATUS[m.status] ? '<span class="k-badge" style="background:rgb(0 0 0/.65);color:#fff">' + STATUS[m.status] + '</span>' : '',
        meta: (m.progress ? '<span>Cap. ' + m.progress + (m.totalChapters ? ' / ' + m.totalChapters : '') + '</span>' : '') + (m.score ? '<span><i class="ti ti-star-filled" aria-hidden="true" style="color:var(--k-gold)"></i> ' + m.score + '</span>' : ''),
        after: m.totalChapters ? '<div class="pf-progress" aria-hidden="true"><i style="width:' + pct + '%"></i></div>' : '',
      });
    }).join('');
  }
  $('lib-filters').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (!b) return; S.libFilter = b.dataset.f; renderLibrary(); });

  // Estadísticas
  function renderStatsTab() {
    var d = S.stats || {}, st = d.stats || {};
    var dec = function (v) { return (v || 0).toLocaleString('es-ES', { maximumFractionDigits: 1 }); };
    var kp = [[nf.format(st.titlesRead || 0), 'Títulos'], [nf.format(st.chaptersCompleted || 0), 'Capítulos'], [dec(st.hoursRead) + ' h', 'De lectura'], [nf.format(Math.max(st.maxStreak || 0, st.currentStreak || 0)), 'Mejor racha']];
    $('kpis').innerHTML = kp.map(function (k) { return '<div class="k-card pf-kpi"><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join('');

    // Mapa de calor: últimas 26 semanas, de lunes a domingo
    var key = function (dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); };
    var days = {}; (d.readingDays || []).forEach(function (r) { var k = new Date(r.date); k.setHours(k.getHours() + 12); days[key(k)] = (days[key(k)] || 0) + (r.chapters || 0); });
    var end = new Date(); end.setHours(0, 0, 0, 0);
    var start = new Date(end); start.setDate(start.getDate() - 7 * 26 + 1); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
    var cells = [], active = 0, total = 0;
    for (var t = new Date(start); t <= end; t.setDate(t.getDate() + 1)) {
      var c = days[key(t)] || 0;
      if (c) { active++; total += c; }
      var l = c === 0 ? 0 : c < 2 ? 1 : c < 4 ? 2 : c < 8 ? 3 : 4;
      cells.push('<i data-l="' + l + '" title="' + t.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) + ': ' + c + ' cap."></i>');
    }
    $('heat').innerHTML = cells.join('');
    $('heat').setAttribute('aria-label', active + ' días con lectura en los últimos 6 meses');
    $('heat-sub').textContent = active + ' días · ' + total + ' capítulos en 6 meses';
    $('heat').parentNode.scrollLeft = 9999;

    var rows = [['Capítulos al día', dec(st.chaptersPerDay)], ['Horas por semana', dec(st.hoursPerWeek)], ['Títulos al mes', dec(st.mangasPerMonth)], ['Racha actual', (st.currentStreak || 0) + ' días']];
    $('rhythm').innerHTML = rows.map(function (r) { return '<div class="k-row k-row--between" style="font-size:var(--k-fs-sm)"><span class="k-muted">' + r[0] + '</span><b>' + r[1] + '</b></div>'; }).join('');
    var top = d.topMangas || [];
    $('top-read').innerHTML = top.length ? top.slice(0, 5).map(function (m) {
      return '<a class="pf-mini" href="/obra/' + encodeURIComponent(m.id) + '">' + (m.cover ? '<img src="' + esc(m.cover) + '" alt="" loading="lazy">' : '<span class="ph"></span>') + '<span style="min-width:0"><b>' + esc(m.title) + '</b><small>' + (m.chaptersRead || 0) + ' capítulos · ' + Math.round(m.minutesRead || 0) + ' min</small></span></a>';
    }).join('') : '<p class="k-muted" style="margin:0;font-size:var(--k-fs-sm)">Aún no hay lecturas registradas.</p>';
  }

  // Logros
  function renderAchs() {
    $('achs').innerHTML = '<div class="k-skeleton" style="height:90px"></div><div class="k-skeleton" style="height:90px"></div><div class="k-skeleton" style="height:90px"></div>';
    api('/api/stats/achievements/' + encodeURIComponent(S.profile.user.id)).then(function (d) {
      var a = (d.achievements || []).slice().sort(function (x, y) { return (y.unlocked - x.unlocked) || ((y.progress || 0) - (x.progress || 0)); });
      var on = a.filter(function (x) { return x.unlocked; }).length;
      $('ach-sub').textContent = on + ' de ' + a.length + ' logros desbloqueados';
      $('achs').innerHTML = a.length ? a.map(function (x) {
        return '<div class="k-card pf-ach' + (x.unlocked ? ' is-on' : '') + '"><span class="ico" aria-hidden="true">' + esc(x.emoji || '🏅') + '</span><div style="min-width:0"><b>' + esc(x.name) + '</b><small>' + esc(x.desc) + '</small>' +
          (x.unlocked ? '<span class="k-badge k-badge--gold">Conseguido</span>' : '<div class="pf-progress" role="progressbar" aria-label="' + esc(x.name) + '" aria-valuenow="' + (x.progress || 0) + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + Math.min(100, x.progress || 0) + '%"></i></div><small style="margin:4px 0 0">' + nf.format(x.cur || 0) + ' / ' + nf.format(x.target || 0) + '</small>') + '</div></div>';
      }).join('') : empty('trophy', 'Sin logros', 'Los logros aparecerán al empezar a leer.');
    }).catch(function () { $('achs').innerHTML = empty('cloud-off', 'No se pudieron cargar los logros', 'Vuelve a intentarlo en un momento.'); });
  }

  // ── Moderación (el servidor comprueba el rol y protege al propietario) ──
  var MOD = {
    warn: { t: 'Enviar aviso', go: 'Enviar aviso', reason: 'Mensaje para el usuario', url: '/api/moderation/warn', body: function (r) { return { message: r }; } },
    strike: { t: 'Añadir strike', go: 'Añadir strike', reason: 'Motivo', url: '/api/moderation/strike', info: 'Con 3 strikes la cuenta se suspende automáticamente.', body: function (r) { return { reason: r }; } },
    mute: { t: 'Silenciar', go: 'Silenciar', reason: 'Motivo', dur: true, url: '/api/moderation/mute', body: function (r, d) { return { reason: r, durationSeconds: d || 86400 }; } },
    ban: { t: 'Suspender cuenta', go: 'Suspender', reason: 'Motivo', dur: true, url: '/api/moderation/ban', info: 'No podrá iniciar sesión mientras dure la suspensión.', body: function (r, d) { return { reason: r, durationSeconds: d || null }; } },
    unban: { t: 'Levantar suspensión', go: 'Levantar suspensión', reason: 'Motivo', url: '/api/moderation/unban', body: function (r) { return { reason: r }; } },
  };
  var modKind = null;
  function openMod(kind) {
    var m = MOD[kind]; modKind = kind;
    $('mod-t').textContent = m.t + ' · ' + S.profile.user.username;
    $('mod-info').textContent = m.info || ''; $('mod-info').hidden = !m.info;
    $('mod-dur-f').hidden = !m.dur;
    $('mod-reason-l').textContent = m.reason; $('mod-reason').value = ''; $('mod-err').textContent = '';
    $('mod-go').textContent = m.go;
    $('mod-go').className = 'k-btn ' + (kind === 'unban' || kind === 'warn' ? 'k-btn--primary' : 'k-btn--danger');
    [].forEach.call($('mod-dur').options, function (o) { o.hidden = o.disabled = kind === 'mute' && o.value === '0'; });
    if (kind === 'mute' && $('mod-dur').value === '0') $('mod-dur').value = '86400';
    setMenu(false);
    $('mod-dlg').showModal(); $('mod-reason').focus();
  }
  $('mod-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var m = MOD[modKind], r = $('mod-reason').value.trim();
    if (!r) { $('mod-err').textContent = 'Escribe el motivo.'; $('mod-reason').focus(); return; }
    var body = Object.assign({ targetUserId: S.profile.user.id }, m.body(r, parseInt($('mod-dur').value, 10)));
    $('mod-go').disabled = true;
    postJSON(m.url, body).then(function (d) {
      $('mod-dlg').close(); toast(d.message || 'Hecho');
      if (modKind === 'ban' || d.autoBanned) S.profile.user.isBanned = true;
      if (modKind === 'unban') S.profile.user.isBanned = false;
      renderHead();
    }).catch(function (er) { $('mod-err').textContent = er.message; })
      .then(function () { $('mod-go').disabled = false; });
  });
})();
</script>
</body>
</html>
