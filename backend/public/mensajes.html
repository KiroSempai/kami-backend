<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensajes · KamiTales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body { background: var(--bg-base); }
    .msg-page { margin-top:0; display:flex; height:calc(100vh - 64px); }
    .msg-sidebar { width:260px; min-width:260px; border-right:1px solid var(--border); overflow-y:auto; background:var(--bg-surface); display:flex; flex-direction:column; }
    .msg-sidebar-header { padding:16px 16px 10px; border-bottom:1px solid var(--border); }
    .msg-sidebar-title { font-family:var(--font-display); font-size:18px; letter-spacing:1px; }
    .msg-sidebar-sub { font-size:10px; color:var(--text-muted); margin-top:1px; }
    .msg-thread { display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; transition:all .12s; border-bottom:1px solid var(--border); }
    .msg-thread:hover { background:rgb(var(--k-ink) / 0.03); }
    .msg-thread.active { background:color-mix(in srgb, var(--k-accent) 8%, transparent); border-left:3px solid var(--accent); }
    .msg-thread-avatar { width:32px; height:32px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:13px; color: var(--k-text); flex-shrink:0; font-weight:700; }
    .msg-thread-info { flex:1; min-width:0; }
    .msg-thread-subject { font-size:12px; font-weight:600; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .msg-thread-meta { font-size:10px; color:var(--text-muted); margin-top:2px; display:flex; gap:6px; }
    .msg-thread-badge { background:var(--accent); color: var(--k-text); font-size:9px; font-weight:700; padding:1px 5px; border-radius:8px; min-width:16px; text-align:center; }
    .msg-status { font-size:9px; padding:1px 6px; border-radius:3px; font-weight:600; text-transform:uppercase; }
    .msg-status.open { background:color-mix(in srgb, var(--k-ok) 15%, transparent); color:var(--green); }
    .msg-status.pending { background:color-mix(in srgb, var(--k-gold) 15%, transparent); color:var(--accent-gold); }
    .msg-status.resolved { background:color-mix(in srgb, var(--k-info) 15%, transparent); color:var(--blue); }
    .msg-status.closed { background:rgb(var(--k-ink) / 0.05); color:var(--text-muted); }
    .msg-main { flex:1; display:flex; flex-direction:column; background:var(--bg-base); min-width:0; }
    .msg-main-empty { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:14px; flex-direction:column; gap:12px; }
    .msg-main-empty .big-icon { font-size:64px; opacity:0.3; }
    .msg-header { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--bg-surface); flex-shrink:0; }
    .msg-header-left { display:flex; align-items:center; gap:10px; }
    .msg-header-subject { font-weight:600; font-size:14px; }
    .msg-header-actions { display:flex; gap:8px; }
    .msg-header-btn { padding:5px 12px; border-radius:6px; font-size:11px; font-weight:600; border:1px solid var(--border); background:rgb(var(--k-ink) / 0.04); color:var(--text-secondary); cursor:pointer; transition:all .12s; font-family:var(--font-body); white-space:nowrap; }
    .msg-header-btn:hover { border-color:var(--accent); color:var(--accent); }
    .msg-conversation { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:8px; }
    .msg-row { display:flex; align-items:flex-end; gap:8px; max-width:80%; }
    .msg-row.incoming { align-self:flex-start; }
    .msg-row.outgoing { align-self:flex-end; flex-direction:row-reverse; }
    .msg-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; color: var(--k-text); font-weight:700; flex-shrink:0; }
    .msg-bubble { padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.5; }
    .msg-row.incoming .msg-bubble { background:var(--bg-card); border:1px solid var(--border); border-bottom-left-radius:4px; }
    .msg-row.outgoing .msg-bubble { background:color-mix(in srgb, var(--k-accent) 15%, transparent); border:1px solid color-mix(in srgb, var(--k-accent) 25%, transparent); border-bottom-right-radius:4px; }
    .msg-bubble .sender { font-size:10px; font-weight:600; color:var(--text-muted); margin-bottom:2px; }
    .msg-bubble .time { font-size:9px; color:var(--text-muted); margin-top:4px; text-align:right; }
    .msg-bubble.system { align-self:center; background:rgb(var(--k-ink) / 0.03); border:1px dashed var(--border); font-size:11px; color:var(--text-muted); text-align:center; max-width:90%; padding:8px 16px; }
    .msg-input-area { padding:12px 20px; border-top:1px solid var(--border); background:var(--bg-surface); display:flex; gap:8px; align-items:flex-end; flex-shrink:0; }
    .msg-input-wrap { flex:1; display:flex; flex-direction:column; gap:4px; }
    .msg-input { width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:rgb(var(--k-ink) / 0.04); color:var(--text-primary); font-family:var(--font-body); font-size:13px; outline:none; resize:none; transition:border-color .15s; box-sizing:border-box; }
    .msg-input:focus { border-color:var(--accent); }
    .msg-send-btn { padding:8px 16px; border-radius:8px; border:none; background:var(--accent); color: var(--k-text); font-weight:600; font-size:13px; cursor:pointer; transition:all .12s; font-family:var(--font-body); height:36px; }
    .msg-send-btn:hover { opacity:.9; }
    .msg-send-btn:disabled { opacity:.4; cursor:not-allowed; }
    .msg-staff-toggle { font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:4px; cursor:pointer; user-select:none; }
    .msg-staff-toggle input { accent-color:var(--accent); }
    .msg-loading { padding:40px; text-align:center; color:var(--text-muted); font-size:13px; }
    .msg-empty-state { padding:60px 20px; text-align:center; color:var(--text-muted); }
    .msg-empty-state .icon { font-size:48px; margin-bottom:12px; opacity:.3; }
    .msg-empty-state .text { font-size:14px; }
    @media(max-width:768px) { .msg-sidebar { width:100%; min-width:auto; } .msg-main { display:none; } .msg-main.open { display:flex; } }
  </style>
  <link rel="stylesheet" href="/css/kami.css">
  <script src="/js/kami-shell.js"></script>
</head>
<body>
<div class="msg-page">
    <div class="msg-sidebar" id="msg-sidebar">
      <div class="msg-sidebar-header">
        <div class="msg-sidebar-title">💬 Mensajes</div>
        <div class="msg-sidebar-sub">Soporte y moderación</div>
      </div>
      <div id="thread-list" style="flex:1;overflow-y:auto;"><div class="msg-loading">Cargando...</div></div>
    </div>
    <div class="msg-main" id="msg-main">
      <div class="msg-main-empty" id="msg-empty"><div class="big-icon"><i class="ti ti-messages" style="font-size:56px;opacity:.35"></i></div><div>Selecciona una conversación</div></div>
      <div id="kami-bubble" style="display:none;flex:1;align-items:center;justify-content:center;padding:24px;">
        <div style="display:inline-flex;flex-direction:column;align-items:center;gap:10px;padding:24px 32px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;max-width:300px;">
          <div style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:var(--accent);border-radius:14px;color: var(--k-text);font-size:22px;">神</div>
          <div style="font-size:16px;font-weight:700;font-family:var(--font-display);letter-spacing:1px;"> · KamiTales</div>
          <div id="bubble-unread" style="font-size:12px;color:var(--text-muted);"></div>
          <div id="bubble-last" style="font-size:11px;color:var(--text-muted);text-align:center;"></div>
          <button class="msg-header-btn" onclick="document.querySelector('.msg-thread')?.click()">Ver mensajes</button>
        </div>
      </div>
      <div id="msg-conversation" style="display:none;flex:1;flex-direction:column;min-height:0;">
        <div class="msg-header" id="msg-header"></div>
        <div class="msg-conversation" id="msg-messages"></div>
        <div class="msg-input-area">
          <div class="msg-input-wrap">
            <textarea class="msg-input" id="msg-input" rows="2" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
            <label class="msg-staff-toggle" id="staff-toggle-wrap" style="display:none;">
              <input type="checkbox" id="staff-check"> Enviar como Staff (anónimo)
            </label>
          </div>
          <button class="msg-send-btn" id="msg-send-btn" onclick="sendMessage()">Enviar</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/notifications.js"></script>
  <script>
    let currentThreadId = null;
    let threads = [];
    const user = JSON.parse(localStorage.getItem('kami_user') || '{}');
    const isMod = ['admin','moderator','company'].includes(user.role);
    const isStaffAnon = ['admin','moderator'].includes(user.role) && user.role !== 'company';

    if (isStaffAnon) document.getElementById('staff-toggle-wrap').style.display = 'flex';

    async function loadThreads() {
      const token = localStorage.getItem('kami_token');
      if (!token) { document.getElementById('thread-list').innerHTML = '<div class="msg-empty-state"><div class="icon">🔒</div><div class="text">Inicia sesión</div></div>'; return; }
      try {
        const r = await fetch('/api/messages', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error');
        threads = data.threads || [];
        renderThreads();
      } catch { document.getElementById('thread-list').innerHTML = '<div class="msg-empty-state"><div class="icon">❌</div><div class="text">Error al cargar</div></div>'; }
    }

    function renderThreads() {
      const el = document.getElementById('thread-list');
      const bubble = document.getElementById('kami-bubble');
      if (threads.length === 0) {
        el.innerHTML = '<div class="msg-empty-state"><div class="icon">📭</div><div class="text">Sin conversaciones</div></div>';
        if (bubble) bubble.style.display = 'none';
        return;
      }
      if (bubble) {
        const totalUnread = threads.reduce((sum, t) => sum + (t.unread || 0), 0);
        bubble.style.display = 'flex';
        document.getElementById('bubble-unread').textContent = 'Mensajes sin abrir: ' + totalUnread;
        document.getElementById('bubble-last').textContent = 'Último: ' + (threads[0].subject || '');
      }
      const si = { open:'🟢', pending:'🟡', resolved:'🔵', closed:'⚪' };
      const isSys = (s) => s && (s.toLowerCase().includes('sistema') || s.toLowerCase().includes('habilitado'));
      el.innerHTML = threads.map(t => '<div class="msg-thread ' + (currentThreadId == t.id ? 'active' : '') + '" onclick="openThread(' + t.id + ')"><div class="msg-thread-avatar" style="background:' + (isSys(t.subject) ? 'var(--accent)' : 'var(--text-muted)') + ';">' + (isSys(t.subject) ? '神' : (t.user_name || '?')[0].toUpperCase()) + '</div><div class="msg-thread-info"><div class="msg-thread-subject">' + (isSys(t.subject) ? '📢 ' : '') + escHtml(t.subject) + '</div><div class="msg-thread-meta"><span class="msg-status ' + t.status + '">' + (si[t.status]||'') + ' ' + t.status + '</span><span>' + (isSys(t.subject) ? ' · KamiTales' : (t.user_name||'?')) + '</span></div></div>' + (t.unread > 0 ? '<div class="msg-thread-badge">' + t.unread + '</div>' : '') + '</div>').join('');
    }

    async function openThread(threadId) {
      currentThreadId = threadId;
      const token = localStorage.getItem('kami_token');
      if (!token) return;
      renderThreads();
      document.getElementById('msg-empty').style.display = 'none';
      document.getElementById('kami-bubble').style.display = 'none';
      const conv = document.getElementById('msg-conversation');
      conv.style.display = 'flex';
      document.getElementById('msg-messages').innerHTML = '<div class="msg-loading">Cargando...</div>';
      try {
        const r = await fetch('/api/messages/' + threadId, { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error');
        document.querySelector('.msg-input').disabled = false;
        document.querySelector('.msg-send-btn').disabled = false;
        renderConversation(data.thread, data.messages);
      } catch { document.getElementById('msg-messages').innerHTML = '<div class="msg-empty-state"><div class="icon">❌</div><div class="text">Error al cargar la conversación</div></div>'; }
    }

    function renderConversation(thread, messages) {
      const header = document.getElementById('msg-header');
      const si = { open:'🟢 Abierto', pending:'🟡 Pendiente', resolved:'🔵 Resuelto', closed:'⚪ Cerrado' };
      const isSys = thread.subject && (thread.subject.toLowerCase().includes('sistema') || thread.subject.toLowerCase().includes('habilitado'));
      header.innerHTML = '<div class="msg-header-left">' +
        '<span style="cursor:pointer;font-size:16px;color:var(--text-muted);margin-right:4px;" onclick="closeChat()" title="Cerrar conversación">←</span>' +
        (isSys ? '<div style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--accent);border-radius:6px;color: var(--k-text);font-size:12px;">神</div>' : '') +
        '<div class="msg-header-subject">' + escHtml(thread.subject) + '</div>' +
        '<span class="msg-status ' + thread.status + '">' + (si[thread.status]||thread.status) + '</span></div>' +
        '<div class="msg-header-actions">' + (isMod ? '<button class="msg-header-btn" onclick="changeStatus(\'' + (thread.status === 'open' ? 'pending' : thread.status === 'pending' ? 'resolved' : thread.status === 'resolved' ? 'closed' : 'open') + '\')">' + (thread.status === 'closed' ? 'Reabrir' : thread.status === 'resolved' ? 'Cerrar' : 'Cambiar estado') + '</button>' : '') + '</div>';

      const msgsEl = document.getElementById('msg-messages');
      if (messages.length === 0) { msgsEl.innerHTML = '<div class="msg-bubble system">Inicio de la conversación</div>'; return; }

      const myAvatar = user.avatar && user.avatar.startsWith('data:image/') ? user.avatar : null;

      msgsEl.innerHTML = messages.map(m => {
        const isMe = m.sender_id === user.id;
        const isSysMsg = m.sender_id === 'system';
        const isStaffMsg = m.is_staff;
        const senderName = isStaffMsg ? 'Staff' : isMe ? 'Tú' : (m.sender_name || 'Usuario');
        const initial = isStaffMsg ? '神' : isMe ? (user.username || '?')[0].toUpperCase() : (m.sender_name || '?')[0].toUpperCase();
        const avatarStyle = isStaffMsg ? 'background:var(--accent);border-radius:6px;font-size:14px;' : (isMe && myAvatar ? 'background-image:url(\'' + myAvatar + '\');background-size:cover;background-position:center;' : 'background:' + (isMe ? 'var(--accent)' : 'var(--text-muted)') + ';');

        if (isSysMsg) return '<div class="msg-bubble system">' + escHtml(m.message) + '</div>';

        return '<div class="msg-row ' + (isMe ? 'outgoing' : 'incoming') + '">' +
          '<div class="msg-avatar" style="' + avatarStyle + '">' + (isStaffMsg ? initial : (isMe && myAvatar ? '' : initial)) + '</div>' +
          '<div class="msg-bubble"><div class="sender">' + escHtml(senderName) + '</div><div>' + escHtml(m.message) + '</div><div class="time">' + new Date(m.created_at).toLocaleString('es-ES', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) + '</div></div>' +
        '</div>';
      }).join('');
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    async function sendMessage() {
      if (!currentThreadId) return;
      const input = document.getElementById('msg-input');
      const msg = input.value.trim();
      if (!msg) return;
      const asStaff = document.getElementById('staff-check')?.checked || false;
      input.value = '';
      document.getElementById('msg-send-btn').disabled = true;
      const token = localStorage.getItem('kami_token');
      try {
        const r = await fetch('/api/messages/' + currentThreadId, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ message: msg, as_staff: asStaff }),
        });
        const data = await r.json();
        if (!r.ok) { alert(data.error || 'Error al enviar'); document.getElementById('msg-send-btn').disabled = false; return; }
        openThread(currentThreadId);
      } catch { alert('Error de conexión'); document.getElementById('msg-send-btn').disabled = false; }
    }

    function closeChat() {
      currentThreadId = null;
      document.getElementById('msg-conversation').style.display = 'none';
      document.getElementById('kami-bubble').style.display = 'flex';
      document.getElementById('msg-empty').style.display = 'none';
      // Unselect active thread
      document.querySelectorAll('.msg-thread').forEach(t => t.classList.remove('active'));
    }

    async function changeStatus(status) {
      if (!currentThreadId) return;
      const token = localStorage.getItem('kami_token');
      try {
        const r = await fetch('/api/messages/' + currentThreadId + '/status', {
          method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ status }),
        });
        const d = await r.json();
        if (!r.ok) { alert(d.error || 'Error'); return; }
        openThread(currentThreadId);
      } catch { alert('Error'); }
    }

    function escHtml(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    const urlParams = new URLSearchParams(window.location.search);
    const threadParam = urlParams.get('thread');
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => { loadThreads().then(() => { if (threadParam) openThread(parseInt(threadParam)); }); });
    else { loadThreads().then(() => { if (threadParam) openThread(parseInt(threadParam)); }); }
  </script>
</body>
</html>
