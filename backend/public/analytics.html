<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics · KAMI Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css?v=9">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --sidebar-w: 240px;
            --sidebar-collapsed: 60px;
            --header-h: 56px;
            --radius-card: 10px;
            --glow-accent: 0 0 20px rgba(232,51,74,0.08);
        }
        body { background: #0a0a0f; color: #e0e0e0; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; height: 100vh; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        /* LAYOUT */
        .analytics-layout { display: flex; height: 100vh; }

        /* SIDEBAR */
        .sidebar { width: var(--sidebar-w); background: #0d0d18; border-right: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; z-index: 10; }
        .sidebar-brand { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .sidebar-brand .logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
        .sidebar-brand .logo-mark { color: var(--accent,#e8344a); font-size: 26px; }
        .sidebar-brand .logo-sub { font-size: 10px; color: rgba(255,255,255,0.25); text-transform: uppercase; letter-spacing: 2px; margin-top: 2px; }
        .sidebar-nav { padding: 12px 0; flex: 1; }
        .sidebar-nav .nav-section { padding: 8px 20px 4px; font-size: 10px; color: rgba(255,255,255,0.2); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: rgba(255,255,255,0.45); text-decoration: none; font-size: 13px; font-weight: 500; transition: all .15s; border-left: 2px solid transparent; cursor: pointer; }
        .sidebar-nav a:hover { color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.02); }
        .sidebar-nav a.active { color: var(--accent,#e8344a); background: rgba(232,51,74,0.06); border-left-color: var(--accent,#e8344a); }
        .sidebar-nav a .icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
        .sidebar-nav .divider { height: 1px; background: rgba(255,255,255,0.04); margin: 8px 20px; }

        /* MAIN */
        .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: #0a0a0f; position: relative; }
        .main-header { padding: 28px 32px 0; flex-shrink: 0; }
        .main-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 1.5px; }
        .main-header p { font-size: 13px; color: rgba(255,255,255,0.35); margin-top: 2px; font-weight: 400; }
        .main-body { padding: 24px 32px 40px; }

        /* SECTION CONTENT */
        .section { display: none; }
        .section.active { display: block; }

        /* KPI ROW */
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .kpi-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: var(--radius-card); padding: 16px; position: relative; overflow: hidden; }
        .kpi-card .kpi-icon { font-size: 18px; margin-bottom: 8px; opacity: 0.5; }
        .kpi-card .kpi-val { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; color: #fff; line-height: 1; }
        .kpi-card .kpi-lbl { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .kpi-card .kpi-sub { font-size: 11px; color: rgba(255,255,255,0.2); margin-top: 2px; }
        .kpi-card .kpi-trend { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 600; }
        .kpi-card .kpi-trend.up { color: #2dca7a; }
        .kpi-card .kpi-trend.down { color: #e8344a; }
        .kpi-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: var(--radius-card) var(--radius-card) 0 0; opacity: 0.3; }
        .kpi-card.accent::after { background: var(--accent,#e8344a); }
        .kpi-card.blue::after { background: #4c9df5; }
        .kpi-card.green::after { background: #2dca7a; }
        .kpi-card.gold::after { background: #f5c842; }
        .kpi-card.purple::after { background: #a78bfa; }
        .kpi-card.orange::after { background: #fb923c; }

        /* CHART GRID */
        .chart-full { margin-bottom: 16px; }
        .chart-half { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .chart-quarter { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .chart-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: var(--radius-card); padding: 20px; }
        .chart-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .chart-card .card-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; color: rgba(255,255,255,0.7); }
        .chart-card .card-tag { font-size: 10px; color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.04); padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .chart-wrap { position: relative; width: 100%; height: 280px; }
        .chart-wrap.tall { height: 360px; }
        .chart-wrap canvas { width: 100% !important; height: 100% !important; }

        /* HEATMAP */
        .heatmap-grid { display: flex; flex-direction: column; gap: 3px; }
        .heatmap-row { display: flex; gap: 3px; }
        .heatmap-cell { width: 14px; height: 14px; border-radius: 3px; background: rgba(255,255,255,0.03); transition: all .15s; cursor: pointer; position: relative; }
        .heatmap-cell:hover { transform: scale(1.3); z-index: 2; }
        .heatmap-cell.lvl1 { background: rgba(76,157,245,0.15); }
        .heatmap-cell.lvl2 { background: rgba(76,157,245,0.3); }
        .heatmap-cell.lvl3 { background: rgba(76,157,245,0.5); }
        .heatmap-cell.lvl4 { background: rgba(76,157,245,0.75); }
        .heatmap-cell.lvl5 { background: rgba(76,157,245,1); }
        .heatmap-labels { display: flex; justify-content: space-between; margin-top: 10px; font-size: 10px; color: rgba(255,255,255,0.2); max-width: 500px; }
        .heatmap-side { display: flex; flex-direction: column; gap: 3px; margin-right: 6px; font-size: 9px; color: rgba(255,255,255,0.15); }
        .heatmap-side span { height: 14px; display: flex; align-items: center; }

        /* TABLE */
        .table-wrap { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .data-table th { text-align: left; padding: 10px 14px; color: rgba(255,255,255,0.25); font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.04); text-transform: uppercase; letter-spacing: 1px; font-size: 10px; }
        .data-table td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.03); color: rgba(255,255,255,0.6); }
        .data-table tr:hover td { background: rgba(255,255,255,0.02); }
        .data-table .mini-cover { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; background: rgba(255,255,255,0.05); display: inline-block; vertical-align: middle; margin-right: 8px; }
        .data-table .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .data-table .badge-action { background: rgba(76,157,245,0.12); color: #4c9df5; }
        .data-table .badge-read { background: rgba(45,202,122,0.12); color: #2dca7a; }
        .data-table .badge-rate { background: rgba(245,200,66,0.12); color: #f5c842; }

        /* PLACEHOLDER */
        .placeholder-card { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px; background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.06); border-radius: var(--radius-card); padding: 40px; text-align: center; }
        .placeholder-card .ph-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.3; }
        .placeholder-card .ph-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: rgba(255,255,255,0.3); }
        .placeholder-card .ph-desc { font-size: 12px; color: rgba(255,255,255,0.15); margin-top: 4px; }

        /* LOADING */
        .loading-wrap { display: flex; align-items: center; justify-content: center; min-height: 300px; }
        .loading-wrap .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.04); border-top-color: var(--accent,#e8344a); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .chart-half { grid-template-columns: 1fr; }
            .chart-quarter { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            .sidebar { width: var(--sidebar-collapsed); }
            .sidebar-brand .logo-sub,
            .sidebar-nav a span { display: none; }
            .sidebar-nav a { justify-content: center; padding: 12px; }
            .sidebar-nav .nav-section { text-align: center; font-size: 8px; }
            .main-header,
            .main-body { padding-left: 16px; padding-right: 16px; }
            .kpi-row { grid-template-columns: repeat(2, 1fr); }
            .chart-quarter { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .kpi-row { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .sidebar.mobile-open { display: flex; position: fixed; inset: 0; width: 100%; z-index: 100; }
        }
    </style>
</head>
<body>
<div class="analytics-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="logo"><span class="logo-mark">神</span>KAMI</div>
            <div class="logo-sub">Analytics Dashboard</div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">Overview</div>
            <a class="active" data-section="general" onclick="switchSection('general')"><span class="icon">📊</span><span>General</span></a>
            <a data-section="patterns" onclick="switchSection('patterns')"><span class="icon">🌍</span><span>Patrones Globales</span></a>

            <div class="divider"></div>
            <div class="nav-section">Usuarios</div>
            <a data-section="growth" onclick="switchSection('growth')"><span class="icon">📈</span><span>Crecimiento</span></a>
            <a data-section="premium-users" onclick="switchSection('premium-users')"><span class="icon">👑</span><span>Usuarios Premium</span></a>

            <div class="divider"></div>
            <div class="nav-section">Contenido</div>
            <a data-section="top-mangas" onclick="switchSection('top-mangas')"><span class="icon">🔥</span><span>Top Mangas</span></a>

            <div class="divider"></div>
            <div class="nav-section">Monetización</div>
            <a data-section="business" onclick="switchSection('business')"><span class="icon">💼</span><span>Negocio & Dinero</span></a>

            <div class="divider"></div>
            <div class="nav-section">Actividad</div>
            <a data-section="timeline" onclick="switchSection('timeline')"><span class="icon">🕒</span><span>Timeline Acciones</span></a>
            <a data-section="recent" onclick="switchSection('recent')"><span class="icon">📋</span><span>Actividad Reciente</span></a>

            <div class="divider"></div>
            <div class="nav-section">Sistema</div>
            <a data-section="admin" onclick="switchSection('admin')"><span class="icon">⚙</span><span>Admin Tools</span></a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="main" id="main-content">
        <div class="main-header">
            <h1 id="section-title">📊 General</h1>
            <p id="section-desc">Resumen global de actividad y usuarios de la plataforma.</p>
        </div>
        <div class="main-body" id="section-body"></div>
    </main>
</div>

<script>
    const TOKEN = localStorage.getItem('kami_token');
    if (!TOKEN) { window.location.href = '/login?return=/admin/analytics'; }

    // Verificar rol admin
    (async function checkAdmin() {
        try {
            var u = JSON.parse(localStorage.getItem('kami_user') || '{}');
            if (u.role === 'admin') return;
            var r = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
            if (r.ok) {
                var data = await r.json();
                if (data.user && data.user.role === 'admin') {
                    localStorage.setItem('kami_user', JSON.stringify(data.user));
                    return;
                }
            }
            window.location.href = '/';
        } catch(e) { window.location.href = '/'; }
    })();

    let charts = {};
    let currentSection = 'general';

    function destroyCharts() {
        Object.values(charts).forEach(c => { try { c.destroy(); } catch(e) {} });
        charts = {};
    }

    async function apiFetch(path) {
        try {
            const r = await fetch(path, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
            if (!r.ok) { if (r.status === 403) window.location.href = '/'; return null; }
            return await r.json();
        } catch { return null; }
    }

    function switchSection(name) {
        currentSection = name;
        document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.toggle('active', a.dataset.section === name));
        destroyCharts();
        loadSection(name);
    }

    function showLoading() {
        document.getElementById('section-body').innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';
    }

    function setHeader(title, desc) {
        document.getElementById('section-title').textContent = title;
        document.getElementById('section-desc').textContent = desc;
    }

    function kpiCard(icon, val, lbl, sub, cls) {
        return '<div class="kpi-card ' + (cls || '') + '"><div class="kpi-icon">' + icon + '</div><div class="kpi-val">' + val + '</div><div class="kpi-lbl">' + lbl + '</div>' + (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') + '</div>';
    }

    function chartCard(title, id, tag, extra) {
        return '<div class="chart-card' + (extra || '') + '"><div class="card-header"><div class="card-title">' + title + '</div>' + (tag ? '<div class="card-tag">' + tag + '</div>' : '') + '</div><div class="chart-wrap"><canvas id="' + id + '"></canvas></div></div>';
    }

    function placeholderCard(icon, title, desc) {
        return '<div class="placeholder-card"><div class="ph-icon">' + icon + '</div><div class="ph-title">' + title + '</div><div class="ph-desc">' + desc + '</div></div>';
    }

    function loadSection(name) {
        showLoading();
        setHeader(
            { general: '📊 General', patterns: '🌍 Patrones Globales', growth: '📈 Crecimiento de Usuarios', business: '💼 Negocio & Dinero', timeline: '🕒 Timeline de Acciones', 'premium-users': '👑 Usuarios Premium', 'top-mangas': '🔥 Top Mangas', recent: '📋 Actividad Reciente', admin: '⚙ Admin Tools' }[name] || '📊 Analytics',
            { general: 'Resumen global de actividad y usuarios de la plataforma.', patterns: 'Patrones de lectura, géneros favoritos y distribución global.', growth: 'Evolución de usuarios, registro, actividad y retención.', business: 'Métricas de monetización, suscripciones y rendimiento.', timeline: 'Actividad del sistema en el tiempo y distribución por tipo.', 'premium-users': 'Usuarios con suscripción premium, tiers y expiraciones.', 'top-mangas': 'Rankings globales de mangas por métricas clave.', recent: 'Feed de las últimas acciones registradas en la plataforma.', admin: 'Herramientas de administración del sistema.' }[name] || ''
        );
        setTimeout(() => {
            if (name === 'general') renderGeneral();
            else if (name === 'patterns') renderPatterns();
            else if (name === 'growth') renderGrowth();
            else if (name === 'business') renderBusiness();
            else if (name === 'timeline') renderTimeline();
            else if (name === 'premium-users') renderPremiumUsers();
            else if (name === 'top-mangas') renderTopMangas();
            else if (name === 'recent') renderRecent();
            else if (name === 'admin') renderAdmin();
        }, 100);
    }

    // ══════════════════════════════════════════════
    // 1. GENERAL
    // ══════════════════════════════════════════════
    async function renderGeneral() {
        const d = await apiFetch('/api/analytics/general');
        if (!d) { document.getElementById('section-body').innerHTML = placeholderCard('📡', 'Sin datos', 'No hay suficientes datos para mostrar.'); return; }

        const conv = d.totalUsers > 0 ? ((d.premium / d.totalUsers) * 100).toFixed(1) : '0.0';
        document.getElementById('section-body').innerHTML = `
            <div class="kpi-row">
                ${kpiCard('👥', d.totalUsers.toLocaleString(), 'Usuarios Totales', '', 'accent')}
                ${kpiCard('🟢', d.activeToday.toLocaleString(), 'Activos Hoy', d.dau + ' DAU · ' + d.wau + ' WAU · ' + d.mau + ' MAU', 'blue')}
                ${kpiCard('⭐', d.premium.toLocaleString(), 'Premium', conv + '% conversión', 'gold')}
                ${kpiCard('⚡', d.totalActions.toLocaleString(), 'Acciones Totales', d.actionsToday.toLocaleString() + ' hoy', 'green')}
                ${kpiCard('📄', d.totalChapters.toLocaleString(), 'Capítulos Leídos', 'global', 'purple')}
            </div>
            ${chartCard('📈 Actividad del Sistema', 'chart-activity', 'acciones / día', ' chart-full')}
            <div class="chart-half">
                ${chartCard('👥 Roles de Usuarios', 'chart-roles', 'distribución')}
                ${chartCard('📊 Nuevos Usuarios / Día', 'chart-newusers', 'últimos 30d')}
            </div>
            <div class="chart-card chart-full">
                <div class="card-header"><div class="card-title">📋 Últimas Métricas</div></div>
                <div class="table-wrap"><table class="data-table" id="general-table"></table></div>
            </div>
        `;

        // Actividad diaria REAL (últimos 30 días)
        const activityData = d.dailyActivity || [];
        const actLabels = activityData.map(r => r.date ? r.date.slice(5) : '');
        const actVals = activityData.map(r => r.count);
        if (actVals.length > 0) {
            makeLine('chart-activity', actLabels, [
                { label: 'Acciones', data: actVals, borderColor: '#e8344a', backgroundColor: 'rgba(232,52,74,0.08)', fill: true }
            ]);
        }

        // Roles REALES desde la BD
        const roles = d.roles || [];
        const roleLabels = roles.map(r => r.role);
        const roleCounts = roles.map(r => r.count);
        if (roleLabels.length > 0) {
            makeDoughnut('chart-roles', roleLabels, roleCounts);
        }

        // Nuevos usuarios REALES (últimos 30 días)
        const regData = d.dailyRegistrations || [];
        const regLabels = regData.map(r => r.date ? r.date.slice(5) : '');
        const regVals = regData.map(r => r.count);
        if (regVals.length > 0) {
            makeBar('chart-newusers', regLabels, regVals, 'Registros');
        }

        const tbody = document.getElementById('general-table');
        tbody.innerHTML = '<tr><th>Métrica</th><th>Valor</th><th>Período</th></tr>' +
            '<tr><td>DAU</td><td>' + d.dau.toLocaleString() + '</td><td>Hoy</td></tr>' +
            '<tr><td>WAU</td><td>' + d.wau.toLocaleString() + '</td><td>7 días</td></tr>' +
            '<tr><td>MAU</td><td>' + d.mau.toLocaleString() + '</td><td>30 días</td></tr>' +
            '<tr><td>Acciones Hoy</td><td>' + d.actionsToday.toLocaleString() + '</td><td>' + new Date().toLocaleDateString('es-ES') + '</td></tr>' +
            '<tr><td>Nuevos Hoy</td><td>' + d.newToday.toLocaleString() + '</td><td>' + new Date().toLocaleDateString('es-ES') + '</td></tr>';
    }

    // ══════════════════════════════════════════════
    // 2. PATRONES GLOBALES
    // ══════════════════════════════════════════════
    async function renderPatterns() {
        const d = await apiFetch('/api/analytics/global-patterns');
        if (!d) { document.getElementById('section-body').innerHTML = placeholderCard('📡', 'Sin datos', 'No hay suficientes datos para mostrar.'); return; }

        document.getElementById('section-body').innerHTML = `
            <div class="chart-card chart-full">
                <div class="card-header"><div class="card-title">🗺️ Mapa de Lectura Global</div><div class="card-tag">día × hora</div></div>
                <div id="global-heatmap" style="display:flex;"></div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:10px;color:rgba(255,255,255,0.2);">
                    <span>Menos</span>
                    <div style="width:12px;height:12px;border-radius:2px;background:rgba(255,255,255,0.03);"></div>
                    <div style="width:12px;height:12px;border-radius:2px;background:rgba(76,157,245,0.15);"></div>
                    <div style="width:12px;height:12px;border-radius:2px;background:rgba(76,157,245,0.3);"></div>
                    <div style="width:12px;height:12px;border-radius:2px;background:rgba(76,157,245,0.5);"></div>
                    <div style="width:12px;height:12px;border-radius:2px;background:rgba(76,157,245,0.75);"></div>
                    <div style="width:12px;height:12px;border-radius:2px;background:#4c9df5;"></div>
                    <span>Más</span>
                    <span style="margin-left:auto;">🎯 ' + (d.avgChaptersPerDay || 0) + ' caps/día promedio global</span>
                </div>
            </div>
            <div class="chart-half">
                ${chartCard('🕐 Horas Más Activas', 'chart-hours', 'actividad')}
                ${chartCard('📊 Capítulos / Día Promedio', 'chart-chapters-avg', 'global')}
            </div>
            <div class="chart-half">
                ${chartCard('🎨 Géneros Favoritos', 'chart-genres', 'distribución')}
                ${chartCard('📖 Tipos Favoritos', 'chart-types', 'manga/manhwa/manhua')}
            </div>
            ${chartCard('⏱️ Top Mangas por Tiempo de Lectura', 'chart-top-time', 'global', ' chart-full')}
            ${chartCard('📄 Top Mangas más Leídos', 'chart-top-reads', 'por capítulos', ' chart-full')}
            <div class="chart-card chart-full">
                <div class="card-header"><div class="card-title">🏆 Rankings Detallados</div></div>

    function buildGlobalHeatmap(hourData) {
        const el = document.getElementById('global-heatmap');
        if (!el) return;
        const days = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
        const hours = Array.from({length: 24}, (_, i) => i);
        const maxCount = Math.max(...hourData.map(h => h.count), 1);

        const side = document.createElement('div');
        side.className = 'heatmap-side';
        days.forEach(d => { const s = document.createElement('span'); s.textContent = d; side.appendChild(s); });

        const grid = document.createElement('div');
        grid.style.flex = '1';

        days.forEach(day => {
            const row = document.createElement('div');
            row.className = 'heatmap-row';
            hours.forEach(h => {
                const data = hourData.find(x => x.hour === h);
                const count = data ? data.count : 0;
                const pct = count / maxCount;
                const cell = document.createElement('div');
                cell.className = 'heatmap-cell';
                if (pct > 0.8) cell.classList.add('lvl5');
                else if (pct > 0.6) cell.classList.add('lvl4');
                else if (pct > 0.4) cell.classList.add('lvl3');
                else if (pct > 0.2) cell.classList.add('lvl2');
                else if (pct > 0) cell.classList.add('lvl1');
                cell.title = day + ' ' + h + ':00 — ' + count + ' acciones';
                row.appendChild(cell);
            });
            grid.appendChild(row);
        });

        el.innerHTML = '';
        el.appendChild(side);
        el.appendChild(grid);
    }

    // 7. TOP MANGAS
    // ══════════════════════════════════════════════
    async function renderTopMangas() {
        const d = await apiFetch('/api/analytics/global-patterns');
        if (!d) { document.getElementById('section-body').innerHTML = placeholderCard('📡', 'Sin datos', 'No hay suficientes datos para mostrar.'); return; }

        document.getElementById('section-body').innerHTML = `
            <div class="kpi-row">
                ${kpiCard('⏱️', ((d.topMangasByTime || [])[0]?.totalMinutes || 0) > 0 ? Math.round(((d.topMangasByTime || [])[0]?.totalMinutes || 0) / 60) + 'h' : '—', 'Top por Tiempo', ((d.topMangasByTime || [])[0]?.title || '—'), 'accent')}
                ${kpiCard('📄', ((d.topMangasByReads || [])[0]?.reads || 0).toLocaleString(), 'Top por Lecturas', ((d.topMangasByReads || [])[0]?.title || '—'), 'blue')}
                ${kpiCard('⭐', ((d.topRated || [])[0]?.rating || '—'), 'Mejor Valorado', ((d.topRated || [])[0]?.title || '—') + ' (' + ((d.topRated || [])[0]?.totalRatings || 0) + ' votos)', 'gold')}
            </div>
            ${chartCard('⏱️ Top por Tiempo de Lectura', 'chart-top-time-detail', 'horas', ' chart-full')}
            ${chartCard('📄 Top por Lecturas', 'chart-top-reads-detail', 'capítulos', ' chart-full')}
            ${chartCard('⭐ Top Mejor Valorados', 'chart-top-rated-detail', 'rating /10', ' chart-full')}
        `;

        const byTime = d.topMangasByTime && d.topMangasByTime.length ? d.topMangasByTime.slice(0, 10) : [{title:'—', totalMinutes:0}];
        const byReads = d.topMangasByReads && d.topMangasByReads.length ? d.topMangasByReads.slice(0, 10) : [{title:'—', reads:0}];
        const byRating = d.topRated && d.topRated.length ? d.topRated.slice(0, 10) : [{title:'—', rating:0}];

        makeHorizBar('chart-top-time-detail', byTime.map(m => m.title || '?'), byTime.map(m => Math.round((m.totalMinutes || 0) / 60)), 'Horas', '#a78bfa');
        makeHorizBar('chart-top-reads-detail', byReads.map(m => m.title || '?'), byReads.map(m => m.reads || 0), 'Lecturas', '#4c9df5');
        makeHorizBar('chart-top-rated-detail', byRating.map(m => m.title || '?'), byRating.map(m => m.rating || 0), 'Rating', '#f5c842');
    }

    // ══════════════════════════════════════════════
    // 8. ACTIVIDAD RECIENTE
    // ══════════════════════════════════════════════
    async function renderRecent() {
        const d = await apiFetch('/api/analytics/recent?limit=50');
        if (!d || !d.recent) { document.getElementById('section-body').innerHTML = placeholderCard('📡', 'Sin datos', 'No hay actividad reciente registrada.'); return; }

        const items = d.recent;
        document.getElementById('section-body').innerHTML = `
            <div class="kpi-row">
                ${kpiCard('📋', items.length.toLocaleString(), 'Últimas Acciones', '', 'blue')}
                ${kpiCard('👥', [...new Set(items.map(r => r.username).filter(Boolean))].length.toLocaleString(), 'Usuarios Distintos', '', 'green')}
                ${kpiCard('📚', [...new Set(items.map(r => r.mangaTitle).filter(Boolean))].length.toLocaleString(), 'Mangas Distintos', '', 'purple')}
            </div>
            <div class="chart-card chart-full">
                <div class="card-header"><div class="card-title">🕐 Feed de Actividad Reciente</div></div>
                <div class="table-wrap"><table class="data-table" id="recent-feed-table"></table></div>
            </div>
        `;

        const tbody = document.getElementById('recent-feed-table');
        tbody.innerHTML = '<tr><th>Usuario</th><th>Acción</th><th>Manga</th><th>Cap</th><th>Fecha</th></tr>' +
            items.map(r => {
                const badgeClass = r.actionType === 'chapter_read' ? 'badge-read' : r.actionType === 'manga_rated' ? 'badge-rate' : 'badge-action';
                return '<tr><td>' + (r.username || '—') + '</td><td><span class="badge ' + badgeClass + '">' + (r.actionType || '') + '</span></td><td>' + (r.mangaTitle || '—') + '</td><td>' + (r.chapterId || '—') + '</td><td style="color:rgba(255,255,255,0.25);font-size:11px;">' + (r.createdAt ? new Date(r.createdAt).toLocaleString('es-ES') : '') + '</td></tr>';
            }).join('');
    }

    // ══════════════════════════════════════════════
    // 9. ADMIN TOOLS
    // ══════════════════════════════════════════════
    function renderAdmin() {
        document.getElementById('section-body').innerHTML = `
            <div class="kpi-row">
                ${kpiCard('⚙️', '—', 'Herramientas de Administración', '', 'accent')}
            </div>
            ${placeholderCard('🛠️', 'Admin Tools', 'Las herramientas de administración avanzada estarán disponibles próximamente.')}
            <div style="margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">
                <div class="placeholder-card" style="min-height:120px;cursor:pointer;" onclick="alert('Export feature coming soon')">
                    <div class="ph-icon" style="font-size:28px;">📥</div>
                    <div class="ph-title" style="font-size:14px;">Exportar Datos</div>
                    <div class="ph-desc">CSV / JSON</div>
                </div>
                <div class="placeholder-card" style="min-height:120px;cursor:pointer;" onclick="alert('Cache clear coming soon')">
                    <div class="ph-icon" style="font-size:28px;">🔄</div>
                    <div class="ph-title" style="font-size:14px;">Limpiar Caché</div>
                    <div class="ph-desc">Forzar recarga</div>
                </div>
                <div class="placeholder-card" style="min-height:120px;cursor:pointer;" onclick="switchSection('general')">
                    <div class="ph-icon" style="font-size:28px;">📊</div>
                    <div class="ph-title" style="font-size:14px;">Ir al Dashboard</div>
                    <div class="ph-desc">Volver a General</div>
                </div>
            </div>
            <div style="text-align:center;margin-top:32px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.04);">
                <a href="/" style="display:inline-flex;align-items:center;gap:8px;padding:10px 24px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;color:rgba(255,255,255,0.4);text-decoration:none;font-size:13px;font-weight:500;transition:all .15s;" onmouseover="this.style.borderColor='rgba(255,255,255,0.15)';this.style.color='rgba(255,255,255,0.7)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.06)';this.style.color='rgba(255,255,255,0.4)'">
                    ← Volver a KAMI
                </a>
            </div>
        `;
    }

    // ══════════════════════════════════════════════
    // CHART HELPERS
    // ══════════════════════════════════════════════
    function getCtx(id) {
        const el = document.getElementById(id);
        if (!el) return null;
        return el.getContext('2d');
    }

    function makeLine(canvasId, labels, datasets) {
        const ctx = getCtx(canvasId);
        if (!ctx) return;
        charts[canvasId] = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets },
            options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: datasets.length > 1, position: 'top', labels: { color: 'rgba(255,255,255,0.4)', font: { size: 10 }, boxWidth: 12 } } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: 'rgba(255,255,255,0.2)', font: { size: 10 } } }, x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,0.2)', font: { size: 10 }, maxTicksLimit: 15 } } } }
        });
    }

    function makeBar(canvasId, labels, data, label) {
        const ctx = getCtx(canvasId);
        if (!ctx || !labels.length) return;
        const colors = labels.map((_, i) => ['#e8344a','#4c9df5','#2dca7a','#f5c842','#a78bfa','#fb923c','#4fc3f7','#ba68c8'][i % 8]);
        charts[canvasId] = new Chart(ctx, {
            type: 'bar', data: { labels, datasets: [{ label, data, backgroundColor: colors, borderRadius: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: 'rgba(255,255,255,0.2)', font: { size: 10 } } }, x: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,0.2)', font: { size: 10 } } } } }
        });
    }

    function makeHorizBar(canvasId, labels, data, label, color) {
        const ctx = getCtx(canvasId);
        if (!ctx || !labels.length) return;
        charts[canvasId] = new Chart(ctx, {
            type: 'bar', data: { labels, datasets: [{ label, data, backgroundColor: color || '#4c9df5', borderRadius: 4 }] },
            options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,0.2)', font: { size: 10 } } }, x: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: 'rgba(255,255,255,0.2)', font: { size: 10 } } } } }
        });
    }

    function makeDoughnut(canvasId, labels, data) {
        const ctx = getCtx(canvasId);
        if (!ctx || !labels.length) return;
        const colors = ['#e8344a','#4c9df5','#2dca7a','#f5c842','#a78bfa','#fb923c','#4fc3f7','#ba68c8'];
        charts[canvasId] = new Chart(ctx, {
            type: 'doughnut', data: { labels, datasets: [{ data, backgroundColor: colors.slice(0, labels.length), borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: 'rgba(255,255,255,0.4)', font: { size: 10 }, boxWidth: 12 } } } }
        });
    }

    function makeRadar(canvasId, labels, data) {
        const ctx = getCtx(canvasId);
        if (!ctx || !labels.length) return;
        charts[canvasId] = new Chart(ctx, {
            type: 'radar', data: { labels, datasets: [{ data, borderColor: '#4c9df5', backgroundColor: 'rgba(76,157,245,0.08)', pointBackgroundColor: '#4c9df5', pointRadius: 3 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { r: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: 'rgba(255,255,255,0.2)', font: { size: 9 }, backdropColor: 'transparent' } } } }
        });
    }

    // ══════════════════════════════════════════════
    // INIT
    // ══════════════════════════════════════════════
    loadSection('general');
</script>
